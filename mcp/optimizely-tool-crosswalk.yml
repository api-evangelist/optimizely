source: mcp/optimizely-mcp.yml + openapi/_original/ (harvested 2026-08-13)
description: >-
  Binds the Optimizely remote MCP surface to the REST operations that back it. Optimizely's
  three MCP servers are OAuth-gated — tools/list returns 401 anonymously — so the live tool
  names and inputSchemas could NOT be captured. What is documented is the capability groups
  ("Query", "Manage", "Implement"), the tool-name prefixes (exp_, oa_, cms_, graph_), and
  three individual tool names. Every row below is therefore mapped by documented capability
  and semantics, not by a tool manifest, and carries confidence: low or medium accordingly.
  Nothing here is asserted as a verified tool name except the three marked verified: true.
caveat: >-
  Tool names in crosswalk[] that are NOT marked verified are capability descriptors, not
  claimed tool identifiers. Re-run this crosswalk with an authenticated tools/list to bind
  real names and inherit real inputSchemas.

surfaces:
  openapi:
    files:
    - openapi/_original/optimizely-web-experimentation-optimizely-api-openapi.json
    - openapi/_original/optimizely-feature-experimentation-optimizely-feature-experimentation-api-openapi.json
    - openapi/_original/optimizely-feature-experimentation-optimizely-flags-scheduling-api-openapi.json
    - openapi/_original/optimizely-feature-experimentation-permission-service-openapi.json
    - openapi/_original/optimizely-platform-optimizely-optimizely-graph-api-openapi.json
    gated: false
  graphql:
    endpoint: https://cg.optimizely.com/content/v2
    note: >-
      Optimizely Graph. Introspection requires a single-key or HMAC credential; the local
      graphql/optimizely-graphql.md capture is documentation, not an introspected SDL.
    gated: true
  mcp:
    servers:
    - {name: optimizely-exp, url: 'https://exp.mcp.opal.optimizely.com/mcp', gated: true, tools_list_status: 401}
    - {name: optimizely-analytics, url: 'https://analytics.mcp.opal.optimizely.com/mcp', gated: true, tools_list_status: 401}
    - {name: optimizely-cms, url: 'https://cms.mcp.opal.optimizely.com/mcp', gated: true, tools_list_status: 401}

