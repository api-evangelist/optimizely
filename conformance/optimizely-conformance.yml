description: >-
  Cross-cutting standards conformance for the Optimizely API estate, derived from the
  harvested contracts and verified against live probes. Optimizely's strongest standards
  posture is on the discovery and agent side — it is one of a small number of providers
  serving a real RFC 9727 API catalog, and its MCP platform implements RFC 9728 + RFC 8414
  + PKCE correctly.
