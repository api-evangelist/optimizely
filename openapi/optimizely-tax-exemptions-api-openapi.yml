components:
  schemas:
    Insite.Data.Entities.TaxExemption:
      required:
      - description
      - name
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        activateOn:
          format: date-time
          type: string
        amount:
          format: double
          type: number
        deactivateOn:
          format: date-time
          type: string
        description:
          maxLength: 255
          minLength: 0
          type: string
        name:
          maxLength: 50
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  requestBodies:
