          format: int32
          type: integer
        hasExperiment:
          type: boolean
        isExperimentVariant:
          type: boolean
        isVariant:
          type: boolean
        isDefaultVariant:
          type: boolean
        path:
          type: string
        name:
          type: string
        type:
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
