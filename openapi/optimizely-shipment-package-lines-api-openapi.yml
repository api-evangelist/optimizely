components:
  schemas:
    Insite.Data.Entities.ShipmentPackageLine:
      required:
      - productName
      - productDescription
      - productCode
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        shipmentPackageId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        productName:
          maxLength: 100
          minLength: 0
          type: string
        productDescription:
          maxLength: 1024
          minLength: 0
          type: string
        productCode:
          maxLength: 50
          minLength: 0
          type: string
        qtyOrdered:
          format: decimal
          type: number
        qtyShipped:
          format: decimal
          type: number
        price:
          format: decimal
          type: number
        orderLineId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
