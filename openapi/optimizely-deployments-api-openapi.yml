components:
  schemas:
    UploadPackageLocationResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
        result:
          $ref: '#/components/schemas/PackageLocationResultModel'
        success:
          type: boolean
    PackageLocationResultModel:
      type: object
      properties:
        location:
          type: string
    InternalServerErrorApiErrorResponseExample:
      type: object
      properties: {}
    DeploymentListResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentApiResponseModel'
        success:
          type: boolean
    UnauthorizedApiErrorResponseExample:
      type: object
      properties: {}
    ApiErrorResponseExample:
      type: object
      properties: {}
    NotFoundApiErrorResponseExample:
      type: object
      properties: {}
    StartDeploymentResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
        result:
          $ref: '#/components/schemas/DeploymentApiResponseModel'
        success:
          type: boolean
    CompleteDeploymentResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
        result:
          $ref: '#/components/schemas/DeploymentApiResponseModel'
        success:
          type: boolean
    DeploymentDetailsResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
        result:
          $ref: '#/components/schemas/DeploymentApiResponseModel'
        success:
          type: boolean
    DeploymentApiResponseModel:
      type: object
      properties:
        projectId:
          format: uuid
          type: string
        status:
          type: string
        startTime:
          format: date-time
          type: string
        endTime:
          format: date-time
          type: string
        percentComplete:
          format: int32
          type: integer
        validationLinks:
          type: array
          items:
            type: string
        deploymentWarnings:
          type: array
          items:
            type: string
        deploymentErrors:
          type: array
          items:
            type: string
        parameters:
          $ref: '#/components/schemas/CodeDeploymentRequest'
        id:
          format: uuid
          type: string
    BadRequestApiErrorResponseExample:
      type: object
      properties: {}
    StartCodeDeploymentRequestParameters:
      type: object
      properties:
        sourceApps:
          type: array
          items:
            type: string
        targetEnvironment:
          type: string
        maintenancePage:
          type: boolean
        includeBlob:
          type: boolean
        includeDb:
          type: boolean
        directDeploy:
          type: boolean
        packages:
          type: array
          items:
            type: string
        zeroDowntimeMode:
          type: string
        sourceEnvironment:
          type: string
      example:
        targetEnvironment: Preproduction
        maintenancePage: true
        includeBlob: false
        includeDb: false
        directDeploy: false
        packages:
        - site.cms.app.1.0.0.nupkg
        zeroDowntimeMode: ReadOnly
    CodeDeploymentRequest:
      type: object
      properties:
        maintenancePage:
          type: boolean
        zeroDowntimeMode:
          type: string
        targetEnvironment:
          type: string
    ResetDeploymentRequestParameters:
      type: object
      properties:
        validateBeforeSwap:
          type: boolean
        complete:
          type: boolean
        resetWithDbRollback:
          type: boolean
      example:
        resetWithDbRollback: true
        validateBeforeSwap: true
        complete: false
    ResetDeploymentResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
        result:
          $ref: '#/components/schemas/DeploymentApiResponseModel'
        success:
          type: boolean
x-readme:
  explorer-enabled: true
  proxy-enabled: true
