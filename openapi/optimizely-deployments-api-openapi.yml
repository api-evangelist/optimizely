  /api/v1.0/projects/{projectId}/deployments:
    get:
      tags:
      - Deployments
      summary: Gets a list of deployments for specified project.
      operationId: DeploymentApi_GetDeploymentList
      parameters:
      - name: projectId
        in: path
        description: Project ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
