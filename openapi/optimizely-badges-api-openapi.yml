      - access_token: []
components:
  schemas:
    Insite.Data.Entities.Badge:
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          maxLength: 255
          minLength: 0
          type: string
        tagName:
          maxLength: 1024
          minLength: 0
          type: string
        sortOrder:
          format: int32
          type: integer
        activateOn:
          format: date-time
          type: string
        deactivateOn:
          format: date-time
          type: string
        displayOnProductImages:
          type: boolean
        displayOnBadgeWidget:
          type: boolean
        ruleManagerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        badgeType:
          maxLength: 50
          minLength: 0
          type: string
        displayText:
          maxLength: 512
          minLength: 0
          type: string
        textColorHexCode:
          maxLength: 6
          minLength: 0
          type: string
        badgeColorHexCode:
          maxLength: 6
          minLength: 0
          type: string
        largeImageBadgePath:
          maxLength: 1024
          minLength: 0
          type: string
        largeImageTextSize:
          maxLength: 50
          minLength: 0
          type: string
        otherImageBadgePath:
          maxLength: 1024
          minLength: 0
          type: string
        otherImageTextSize:
          maxLength: 50
          minLength: 0
          type: string
        imageAltText:
          maxLength: 1024
          minLength: 0
          type: string
        detailWidgetBadgeSize:
          maxLength: 50
          minLength: 0
          type: string
        badgeStyle:
          maxLength: 50
          minLength: 0
          type: string
        largeImagePlacement:
          maxLength: 50
          minLength: 0
          type: string
        otherImagePlacement:
          maxLength: 50
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
