components:
  schemas:
    Insite.Data.Entities.InvoiceHistory:
      required:
      - invoiceNumber
      - invoiceType
      - customerNumber
      - customerSequence
      - customerPO
      - status
      - currencyCode
      - terms
      - shipCode
      - salesperson
      - btCompanyName
      - btAddress1
      - btAddress2
      - btCity
      - btState
      - btPostalCode
      - btCountry
      - stCompanyName
      - stAddress1
      - stAddress2
      - stCity
      - stState
      - stPostalCode
      - stCountry
      - notes
      - customerVatNumber
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        invoiceNumber:
          maxLength: 50
          minLength: 0
          type: string
        invoiceDate:
          format: date-time
          type: string
        dueDate:
          format: date-time
          type: string
        invoiceType:
          maxLength: 50
          minLength: 0
          type: string
        customerNumber:
          maxLength: 50
          minLength: 0
          type: string
        customerSequence:
          maxLength: 50
          minLength: 0
          type: string
        customerPO:
          maxLength: 50
          minLength: 0
          type: string
        status:
          maxLength: 50
          minLength: 0
          type: string
        isOpen:
          type: boolean
        currencyCode:
          maxLength: 50
          minLength: 0
          type: string
        terms:
          maxLength: 50
          minLength: 0
          type: string
        shipCode:
          maxLength: 50
          minLength: 0
          type: string
        salesperson:
          maxLength: 50
          minLength: 0
          type: string
        btCompanyName:
          maxLength: 100
          minLength: 0
          type: string
        btAddress1:
          maxLength: 100
          minLength: 0
          type: string
        btAddress2:
          maxLength: 100
          minLength: 0
          type: string
        btCity:
          maxLength: 100
          minLength: 0
          type: string
        btState:
          maxLength: 50
          minLength: 0
          type: string
        btPostalCode:
          maxLength: 50
          minLength: 0
          type: string
        btCountry:
          maxLength: 100
          minLength: 0
          type: string
        stCompanyName:
          maxLength: 100
          minLength: 0
          type: string
        stAddress1:
          maxLength: 100
          minLength: 0
          type: string
        stAddress2:
          maxLength: 100
          minLength: 0
          type: string
        stCity:
          maxLength: 100
          minLength: 0
          type: string
        stState:
          maxLength: 50
          minLength: 0
          type: string
        stPostalCode:
          maxLength: 50
          minLength: 0
          type: string
        stCountry:
          maxLength: 100
          minLength: 0
          type: string
        notes:
          type: string
        productTotal:
          format: decimal
          type: number
        discountAmount:
          format: decimal
          type: number
        shippingAndHandling:
          format: decimal
          type: number
        otherCharges:
          format: decimal
          type: number
        taxAmount:
          format: decimal
          type: number
        invoiceTotal:
          format: decimal
          type: number
        currentBalance:
          format: decimal
          type: number
        customerVatNumber:
          maxLength: 50
          minLength: 0
          type: string
        shippingVatAmount:
          format: decimal
          type: number
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
