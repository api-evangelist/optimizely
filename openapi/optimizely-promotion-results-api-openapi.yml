  /api/v1/admin/promotionresults/delete:
    delete:
      tags:
      - Promotion Results
      operationId: PromotionResults_DeleteRoute
      parameters:
      - name: ids
        in: query
        required: true
        explode: true
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
