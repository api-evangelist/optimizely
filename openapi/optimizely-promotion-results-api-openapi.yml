components:
  schemas:
    System.Threading.CancellationToken:
      type: object
      properties:
        isCancellationRequested:
          type: boolean
          readOnly: true
        canBeCanceled:
          type: boolean
          readOnly: true
        waitHandle:
          $ref: '#/components/schemas/System.Threading.WaitHandle'
    Microsoft.Win32.SafeHandles.SafeWaitHandle:
      type: object
      properties:
        isInvalid:
          type: boolean
          readOnly: true
        isClosed:
          type: boolean
          readOnly: true
    System.Threading.WaitHandle:
      type: object
      properties:
        handle:
          type: object
        safeWaitHandle:
          $ref: '#/components/schemas/Microsoft.Win32.SafeHandles.SafeWaitHandle'
    Insite.Data.Entities.PromotionResult:
      required:
      - promotionResultType
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        promotionId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        productId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        amount:
          format: double
          type: number
        promotionResultType:
          maxLength: 100
          minLength: 0
          type: string
        visible:
          type: boolean
        shipViaId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        categoryId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        maxValue:
          format: double
          type: number
        qtyRequired:
          format: double
          type: number
        maxFree:
          format: double
          type: number
        isPercent:
          type: boolean
        vendorId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        brandId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        productLineId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        qualifyingProductId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        customResultName:
          maxLength: 255
          minLength: 0
          type: string
        code:
          maxLength: 255
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  requestBodies:
    System.Threading.CancellationToken:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/System.Threading.CancellationToken'
      description: import action parameters
      required: true
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
