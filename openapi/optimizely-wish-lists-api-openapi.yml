components:
  requestBodies:
    Affiliates_ArchiveParameters:
      content:
        application/json:
          schema:
            type: object
            properties: {}
      description: archive action parameters
  schemas:
    Insite.Data.Entities.WishList:
      required:
      - name
      - shareOption
      - description
      - sharedBy
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        userProfileId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        customerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          maxLength: 255
          minLength: 0
          type: string
        modifiedByUserProfileId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        allowEdit:
          type: boolean
        shareOption:
          maxLength: 50
          minLength: 0
          type: string
        description:
          maxLength: 300
          minLength: 0
          type: string
        sharedBy:
          maxLength: 100
          minLength: 0
          type: string
        isGlobal:
          type: boolean
        isDynamic:
          type: boolean
        isDynamicCustomers:
          type: boolean
        ruleManagerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        ruleManagerCustomersId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        activateOn:
          format: date-time
          type: string
        deactivateOn:
          format: date-time
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
