components:
  schemas:
    Insite.Data.Entities.Salesperson:
      required:
      - salespersonNumber
      - name
      - salesClass
      - code
      - referenceNumber
      - email
      - phone1
      - phone2
      - title
      - imagePath
      - description
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        salespersonNumber:
          maxLength: 50
          minLength: 0
          type: string
        name:
          maxLength: 100
          minLength: 0
          type: string
        salesClass:
          maxLength: 50
          minLength: 0
          type: string
        code:
          maxLength: 50
          minLength: 0
          type: string
        referenceNumber:
          maxLength: 50
          minLength: 0
          type: string
        isOutsideRep:
          type: boolean
        salesPeriodToDate:
          format: decimal
          type: number
        salesYearToDate:
          format: decimal
          type: number
        email:
          maxLength: 128
          minLength: 0
          type: string
        phone1:
          maxLength: 50
          minLength: 0
          type: string
        phone2:
          maxLength: 50
          minLength: 0
          type: string
        title:
          maxLength: 100
          minLength: 0
          type: string
        userProfileId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        imagePath:
          maxLength: 1024
          minLength: 0
          type: string
        description:
          maxLength: 1024
          minLength: 0
          type: string
        minMarginAllowed:
          format: decimal
          type: number
        maxDiscountPercent:
          format: decimal
          type: number
        salesManagerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
