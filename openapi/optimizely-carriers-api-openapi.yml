components:
  schemas:
    Insite.Data.Entities.Carrier:
      required:
      - name
      - description
      - imagePath
      - userName
      - password
      - accountNumber
      - accessKey
      - clientId
      - clientSecret
      - liveUrl
      - testUrl
      - trackingUrl
      - ratingService
      - contactName
      - contactPhone
      - contactEmail
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          maxLength: 100
          minLength: 0
          type: string
        description:
          maxLength: 255
          minLength: 0
          type: string
        imagePath:
          maxLength: 1024
          minLength: 0
          type: string
        userName:
          maxLength: 100
          minLength: 0
          type: string
        password:
          maxLength: 100
          minLength: 0
          type: string
        accountNumber:
          maxLength: 100
          minLength: 0
          type: string
        accessKey:
          maxLength: 255
          minLength: 0
          type: string
        useOAuth:
          type: boolean
        clientId:
          maxLength: 255
          minLength: 0
          type: string
        clientSecret:
          maxLength: 255
          minLength: 0
          type: string
        enable:
          type: boolean
        isLive:
          type: boolean
        liveUrl:
          maxLength: 1024
          minLength: 0
          type: string
        testUrl:
          maxLength: 1024
          minLength: 0
          type: string
        trackingUrl:
          maxLength: 1024
          minLength: 0
          type: string
        isPrimaryCarrier:
          type: boolean
        ratingService:
          maxLength: 500
          minLength: 0
          type: string
        contactName:
          maxLength: 100
          minLength: 0
          type: string
        contactPhone:
          maxLength: 50
          minLength: 0
          type: string
        contactEmail:
          maxLength: 100
          minLength: 0
          type: string
        backUpCarrierId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        currencyId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        ruleManagerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
