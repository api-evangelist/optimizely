  /api/v1/admin/rulemanagers/delete:
    delete:
      tags:
      - Rule Managers
      operationId: RuleManagers_DeleteRoute
      parameters:
      - name: ids
        in: query
        required: true
        explode: true
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      deprecated: false
      security:
      - access_token: []
  /api/v1/admin/rulemanagers({key})/customproperties({custompropertyKey}):
    get:
      tags:
      - Rule Managers
      operationId: RuleManagers_GetCustomPropertyByKeyAndCustompropertykey
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: custompropertyKey
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: $expand
        in: query
        description: Expands related entities inline.
        required: false
        schema:
          type: string
      - name: $select
        in: query
        description: Selects which properties to include in the response.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      deprecated: false
      security:
      - access_token: []
  /api/v1/admin/rulemanagers({key})/ruleclauses({ruleclauseKey}):
    get:
      tags:
      - Rule Managers
      operationId: RuleManagers_GetRuleClauseByKeyAndRuleclausekey
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ruleclauseKey
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: $expand
        in: query
        description: Expands related entities inline.
        required: false
        schema:
          type: string
      - name: $select
        in: query
        description: Selects which properties to include in the response.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      deprecated: false
      security:
      - access_token: []
components:
  schemas:
    Insite.Data.Entities.RuleManager:
      required:
      - name
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        ruleTypeId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          maxLength: 100
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
    Insite.Data.Entities.RuleClause:
      required:
      - condition
      - criteriaType
      - criteriaObject
      - criteriaProperty
      - criteriaValue
      - comparisonOperator
      - simpleValue
      - valueList
      - valueMinimum
      - valueMaximum
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        ruleManagerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        ruleTypeOptionId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        executionGroup:
          format: int32
          type: integer
        executionOrder:
          format: int32
          type: integer
        condition:
          maxLength: 50
          minLength: 0
          type: string
        criteriaType:
          maxLength: 50
          minLength: 0
          type: string
        criteriaObject:
          maxLength: 255
          minLength: 0
          type: string
        criteriaProperty:
          maxLength: 100
          minLength: 0
          type: string
        criteriaValue:
          maxLength: 255
          minLength: 0
          type: string
        comparisonOperator:
          maxLength: 50
          minLength: 0
          type: string
        simpleValue:
          maxLength: 2048
          minLength: 0
          type: string
        valueList:
          maxLength: 2048
          minLength: 0
          type: string
        valueMinimum:
          maxLength: 100
          minLength: 0
          type: string
        valueMaximum:
          maxLength: 100
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
