  /api/v1/admin/RuleManagers/Default.Default():
    get:
      tags:
      - Rule Managers
      summary: Call operation  Default
      operationId: RuleManagers_Default
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      deprecated: false
      security:
      - access_token: []
  /api/v1/admin/RuleManagers({id})/Default.rules:
    post:
      tags:
      - Rule Managers
      summary: Call operation  rules
      operationId: RuleManagers_SetRulesById
      parameters:
      - name: id
        in: path
        description: 'key: id'
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ruleClauses:
                  type: array
                  items:
                    $ref: '#/components/schemas/Insite.Data.Entities.RuleClause'
        description: rules action parameters
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      deprecated: false
      security:
      - access_token: []
  /api/v1/admin/rulemanagers({key})/rules:
    post:
      tags:
      - Rule Managers
      operationId: RuleManagers_SetRulesByKey
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
