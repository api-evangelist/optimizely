components:
  schemas:
    Insite.Data.Entities.Country:
      required:
      - name
      - abbreviation
      - isoCode2
      - isoCode3
      - isoNumber
      - distanceUnitOfMeasure
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          maxLength: 100
          minLength: 0
          type: string
        abbreviation:
          maxLength: 32
          minLength: 0
          type: string
        isActive:
          type: boolean
        isoCode2:
          maxLength: 50
          minLength: 0
          type: string
        isoCode3:
          maxLength: 50
          minLength: 0
          type: string
        isoNumber:
          maxLength: 50
          minLength: 0
          type: string
        distanceUnitOfMeasure:
          maxLength: 50
          minLength: 0
          type: string
        blockAnonymousTraffic:
          type: boolean
        defaultVatCodeId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        piiRegionId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
