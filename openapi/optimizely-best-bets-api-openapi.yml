openapi: 3.2.0
info:
  title: Optimizely Graph 🏆 BestBets API
  version: 3.24.0
  description: Optimizely Graph API definition
  license:
    name: ' '
  contact:
    name: Documentation
    url: https://cg.optimizely.com/
servers:
- url: https://prod.cg.optimizely.com
tags:
- name: Best Bets
paths:
  /api/bestbets/collection:
    get:
      operationId: get-BestBetCollectionHandler
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BestBetCollectionResult'
                type: array
      description: Get all bestbet collections or get by Id
      summary: Get bestbet collection(s)
      tags:
      - Best Bets
      deprecated: true
      security:
      - epi-hmac: []
      - Bearer: []
      - Basic: []
      parameters:
      - in: query
        name: id
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          format: double
          type: number
    post:
      operationId: create-BestBetCollectionHandler
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BestBetCollectionResult'
      summary: Register a bestbet collection
      tags:
      - Best Bets
      deprecated: true
      security:
      - epi-hmac: []
      - Bearer: []
      - Basic: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BestBetCollectionPayload'
  /api/bestbets/collection/{id}:
    put:
      operationId: update-BestBetCollectionHandler
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BestBetCollectionResult'
      description: Update bestbet collection by Id
      summary: Update a bestbet collection
      tags:
      - Best Bets
      deprecated: true
      security:
      - epi-hmac: []
      - Bearer: []
      - Basic: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BestBetCollectionPayload'
    delete:
      operationId: delete-BestBetCollectionHandler
      responses:
        '204':
          description: No content
      description: Delete bestbet by Id
      summary: Delete a bestbet collection
      tags:
      - Best Bets
      deprecated: true
      security:
      - epi-hmac: []
      - Bearer: []
      - Basic: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
components:
  schemas:
    BestBetCollectionResult:
      properties:
        title:
          type: string
        id:
          type: string
      required:
      - title
      - id
      type: object
      additionalProperties: false
    BestBetCollectionPayload:
      properties:
        title:
          type: string
      required:
      - title
      type: object
      additionalProperties: false
  securitySchemes:
    epi-single:
      type: apiKey
      name: auth
      in: query
      description: Single key authentication
    epi-hmac:
      type: apiKey
      name: Authorization
      in: header
      description: HMAC authentication (`epi-hmac xxx`)
    Basic:
      type: http
      scheme: basic
      description: HMAC credentials
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token
