components:
  schemas:
    Insite.Data.Entities.UserPaymentProfile:
      required:
      - description
      - cardType
      - expirationDate
      - maskedCardNumber
      - cardIdentifier
      - cardHolderName
      - address1
      - address2
      - address3
      - address4
      - city
      - state
      - postalCode
      - country
      - tokenScheme
      - accountIdentifier
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        userProfileId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        description:
          maxLength: 100
          minLength: 0
          type: string
        cardType:
          maxLength: 50
          minLength: 0
          type: string
        expirationDate:
          maxLength: 50
          minLength: 0
          type: string
        maskedCardNumber:
          maxLength: 50
          minLength: 0
          type: string
        cardIdentifier:
          maxLength: 50
          minLength: 0
          type: string
        cardHolderName:
          maxLength: 50
          minLength: 0
          type: string
        address1:
          maxLength: 100
          minLength: 0
          type: string
        address2:
          maxLength: 100
          minLength: 0
          type: string
        address3:
          maxLength: 100
          minLength: 0
          type: string
        address4:
          maxLength: 100
          minLength: 0
          type: string
        city:
          maxLength: 100
          minLength: 0
          type: string
        state:
          maxLength: 50
          minLength: 0
          type: string
        postalCode:
          maxLength: 50
          minLength: 0
          type: string
        country:
          maxLength: 100
          minLength: 0
          type: string
        isDefault:
          type: boolean
        tokenScheme:
          maxLength: 50
          minLength: 0
          type: string
        accountIdentifier:
          maxLength: 200
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
