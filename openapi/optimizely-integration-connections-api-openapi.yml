  /api/v1/admin/IntegrationConnections/Default.Default():
    get:
      tags:
      - Integration Connections
      summary: Call operation  Default
      operationId: IntegrationConnections_Default
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      deprecated: false
      security:
      - access_token: []
  /api/v1/admin/integrationconnections/delete:
    delete:
      tags:
      - Integration Connections
      operationId: IntegrationConnections_DeleteRoute
      parameters:
      - name: ids
        in: query
        required: true
        explode: true
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      deprecated: false
      security:
      - access_token: []
  /api/v1/admin/integrationconnections({key})/customproperties({custompropertyKey}):
    get:
      tags:
      - Integration Connections
      operationId: IntegrationConnections_GetCustomPropertyByKeyAndCustompropertykey
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          format: uuid
