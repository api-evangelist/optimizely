components:
  schemas:
    Insite.Data.Entities.IntegrationConnection:
      required:
      - name
      - typeName
      - dataSource
      - runsOn
      - delimiter
      - url
      - logOn
      - password
      - connectionString
      - archiveFolder
      - systemNumber
      - client
      - language
      - connectionsLimit
      - connectionTimeout
      - appServerHost
      - appServerService
      - messageServerHost
      - messageServerService
      - gatewayHost
      - gatewayService
      - systemId
      - systemIds
      - logonGroup
      - sourceServerTimeZone
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          maxLength: 255
          minLength: 0
          type: string
        typeName:
          maxLength: 255
          minLength: 0
          type: string
        dataSource:
          maxLength: 255
          minLength: 0
          type: string
        runsOn:
          maxLength: 255
          minLength: 0
          type: string
        debuggingEnabled:
          type: boolean
        delimiter:
          maxLength: 255
          minLength: 0
          type: string
        url:
          maxLength: 2048
          minLength: 0
          type: string
        logOn:
          maxLength: 255
          minLength: 0
          type: string
        password:
          maxLength: 255
          minLength: 0
          type: string
        connectionString:
          maxLength: 2048
          minLength: 0
          type: string
        archiveFolder:
          maxLength: 512
          minLength: 0
          type: string
        archiveRetentionDays:
          format: int32
          type: integer
        integratedSecurity:
          type: boolean
        systemNumber:
          maxLength: 255
          minLength: 0
          type: string
        client:
          maxLength: 255
          minLength: 0
          type: string
        language:
          maxLength: 255
          minLength: 0
          type: string
        connectionsLimit:
          maxLength: 255
          minLength: 0
          type: string
        connectionTimeout:
          maxLength: 255
          minLength: 0
          type: string
        appServerHost:
          maxLength: 255
          minLength: 0
          type: string
        appServerService:
          maxLength: 255
          minLength: 0
          type: string
        messageServerHost:
          maxLength: 255
          minLength: 0
          type: string
        messageServerService:
          maxLength: 255
          minLength: 0
          type: string
        gatewayHost:
          maxLength: 255
          minLength: 0
          type: string
        gatewayService:
          maxLength: 255
          minLength: 0
          type: string
        systemId:
          maxLength: 255
          minLength: 0
          type: string
        systemIds:
          maxLength: 255
          minLength: 0
          type: string
        logonGroup:
          maxLength: 255
          minLength: 0
          type: string
        sourceServerTimeZone:
          maxLength: 255
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
