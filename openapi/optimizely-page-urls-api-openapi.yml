components:
  schemas:
    Insite.Data.Entities.PageUrl:
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        nodeId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        publishOn:
          format: date-time
          type: string
        publishUntil:
          format: date-time
          type: string
        url:
          type: string
        title:
          type: string
        languageId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        websiteId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        excludeFromNavigation:
          type: boolean
        hideFromSearchEngines:
          type: boolean
        excludeFromSignInRequired:
          type: boolean
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
