          example: 1000
          format: int64
          type: integer
        holdback:
          description: Percent of traffic to exclude from the experiment, measured in basis points. 100 basis points = 1% traffic. For example, a value of 9900 would mean that 1% of visitors will be eligible for the experiment. This is only applicable for Web.
          example: 5000
          maximum: 10000
          minimum: 0
          type: integer
        key:
          description: Unique string idz for this Experiment within the Project. Only applicable for Full Stack and Mobile projects.
