          type: array
        created:
          description: The time when the Experiment was initially created
          format: date-time
          readOnly: true
          type: string
        custom_field_values:
          additionalProperties: true
          description: Map of custom field `api_name` to value, inherited from the parent Campaign. Keys correspond to the `api_name` of a custom field definition for the Project, and values are typed according to that definition's `field_type`. Returns an empty object when no values are set. Read-only on the Experiment endpoint — to update these values, use the parent Campaign endpoint.
          readOnly: true
          type: object
        description:
          description: The description or hypothesis for an Experiment
          type: string
        earliest:
          description: The first time the Experiment was activated
          format: date-time
          readOnly: true
          type: string
