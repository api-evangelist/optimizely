          format: date-time
          readOnly: true
          type: string
        metrics:
          default: []
          description: An ordered list of metrics to track for the Experiment. Required for Web, Full Stack, and Mobile Experimentation. Not applicable for Web Personalization Experiences.
          items:
            $ref: '#/components/schemas/Metric_2'
          type: array
        multivariate_traffic_policy:
          description: For Experiments of type `multivariate`, this specifies how the weights and statuses of combinations will be decided. In `full_factorial` mode, | combination weights are read-only, and are generated by multiplying together weights of section variations.
          enum:
          - full_factorial
          type: string
        name:
          description: Name of the Experiment. Required for Web Experimentation. Optional for Web Personalization experiences and Full Stack experiments. Not applicable for Mobile Experiments.
          example: Blue Button Experiment
          type: string
        page_ids:
          description: A list of Page IDs used in the Experiment.  `url_targeting` or `page_ids`, but not both.
          items:
            format: int64
            type: integer
          type: array
        project_id:
          description: The Project the Experiment is in
          example: 1000
          format: int64
          type: integer
        results_token:
