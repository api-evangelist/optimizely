          type: string
        schedule:
          $ref: '#/components/schemas/Schedule'
        status:
          description: Current state of the Experiment.<br> In Full Stack, this is the Experiment's state in the primary (production) environment.
          enum:
          - running
          - paused
          - archived
          - campaign_paused
          - concluded
          - not_started
          readOnly: true
          type: string
        traffic_allocation:
          description: Percent of traffic allocated for the experiment, measured in basis points. 100 basis points = 1% traffic. For example, a value of 5500 would mean that 55% of visitors will be eligible for the experiment. This is only applicable for Full Stack.
          example: 5000
          maximum: 10000
          minimum: 0
          type: integer
        type:
          default: a/b
          description: Indicates whether this is an `a/b`, `multivariate`, `feature`, or `multiarmed_bandit` test or an experience within a `personalization` campaign. Note that the default for this field is `a/b`. If another test type is desired, populate this field with the appropriate string (from one of the possible values).
          enum:
          - a/b
          - feature
          - multivariate
          - personalization
          - multiarmed_bandit
          type: string
        url_targeting:
          $ref: '#/components/schemas/URLTargeting'
        variations:
          description: A list of variations that each define an experience to show in the context of the Experiment for the purpose of comparison against each other
          items:
            $ref: '#/components/schemas/Variation_2'
          type: array
        whitelist:
          description: A list containing the user IDs and variations of users who have been whitelisted
          items:
            properties:
              user_id:
                description: The ID of the user being whitelisted
                example: user_1
                type: string
              variation_id:
                description: The unique identifier for the variation
                example: 12345
                format: int64
                type: integer
            required:
