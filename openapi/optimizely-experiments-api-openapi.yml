    ExperimentMetricResults:
      description: Results specific to an Event
      properties:
        aggregator:
          description: The aggregation function for the numerator of the metric. 'unique' measures the number of unique visitors/sessions that include the specified Event. 'count' measures the total number of occurrences of Event for the scope (visitor/session). 'sum' is the sum of the 'field' value. 'exit' measures the ratio of sessions with last activation occurring on the target page to the sessions that activated the target page at least once during the session. 'bounce' measures the ratio of sessions that with first and last activation occurring on the target page to the sessions with first activation on the target page. For both 'exit' and 'bounce', the eventId must be the ID of a Page.
          enum:
          - unique
          - count
          - sum
          - exit
          - bounce
          - ratio
          type: string
        conclusion:
          $ref: '#/components/schemas/ExperimentMetricConclusion'
        event_id:
          description: The ID for the Event to select data from. Omitted for global metrics that are not relative to a specific Event, i.e. "overall revenue"
          format: int64
          type:
          - integer
          - 'null'
        event_properties:
          $ref: '#/components/schemas/MetricEventProperties'
          description: The conditions used to filter the metric on specific event property values.
        field:
          description: The field to aggregate for the numerator of the metric. Required when 'aggregator' = 'sum', otherwise omitted
          enum:
          - revenue
          - value
          type: string
        metrics:
          description: A list of all metrics that will be used in the calculation of a ratio metric.
          items:
            $ref: '#/components/schemas/CompoundSubMetric'
          type: array
        name:
          description: The name of the Metric
          type: string
        results:
          additionalProperties:
            $ref: '#/components/schemas/VariantResults'
          description: A map of results for each variation in the Experiment keyed by variation ID. For Personalization Campaigns, the special variant 'baseline' represents visitors that have been held back from any change in experience for the Experiment
          type: object
          x-map-key:
            description: The ID for the variation
            example: '9000'
            type: string
        scope:
          description: Specifies how Events should be grouped together. Can also be thought of as the denonimator of the metric. 'session' divides by the number of sessions. "Influenced sessions", or sessions that do not contain a decision Event but carry a decision from a previous session are not included in counts for numerator or denominator. 'visitor' divides by the number of visitors. 'event' divides by the total occurrences (impressions) of the specified Event
          enum:
          - session
          - visitor
          - event
          type: string
        time_window:
          description: The maximum amount of time a numerator event can differ from a denominator event in order to be included in a ratio metric. This can be an integer, or an integer followed by a letter denoting the unit of time (d = days, h = hours, m = minutes). If no unit of time is supplied, hours is assumed. If no value is supplied, a time window of 48 hours is assumed.
          type: string
        winning_direction:
          description: The winning direction of this metric
          enum:
          - increasing
          - decreasing
          type: string
      type: object
    MetricEventProperties:
      description: The conditions used to filter the metric on specific event property values.
      properties:
        filter:
          $ref: '#/components/schemas/MetricFilter'
          description: The set of event property conditions a conversion must match to be counted toward the metric.
      type: object
    VariantResults:
      properties:
        experiment_id:
          description: The unique identifier for the Experiment this entity contains results for (if applicable)
          format: int64
          type: integer
        is_baseline:
          description: Indicates that this variant is the baseline that all other entities will be compared against. Also referred to as the 'Control' or 'Control Group'
          type: boolean
        level:
          description: The level of entity that this variant represents
          enum:
          - variation
          - experiment
          - campaign
          type: string
        lift:
          $ref: '#/components/schemas/Datapoint'
        name:
          description: The name of the variant
          example: Blue Button
          type: string
        rate:
          description: The value of the metric after dividing the numerator value over the denominator value
          format: double
          type: number
        samples:
          description: The value of the denominator
          format: int64
          type: number
        total_increase:
          $ref: '#/components/schemas/Datapoint'
        value:
          description: The value of the numerator
          format: int64
          type: number
        variance:
          description: The variance of the metric value
          format: double
          type: number
        variation_id:
          description: The unique identifier for the variation this entity contains results for (if applicable)
          type: string
      type: object
    Datapoint:
      description: A value with statistical context
      properties:
        confidence_interval:
          description: The confidence interval measures the uncertainty around improvement. It starts out wide and shrinks as more data comes in. Significance means that the confidence interval is completely above or completely below 0. If the result is significant and positive, the confidence interval will be above 0. If the result is significant and negative, confidence interval will be below 0. If the result is inconclusive, confidence interval includes 0
          example:
          - 0.010399560300730457
          - 0.0850821459929161
          items:
            format: double
            type: number
          maxItems: 2
          minItems: 2
          type: array
        confidence_interval_scaled:
          description: The confidence interval with bounds that are scaled by the baseline conversion rate.
          items:
            format: double
            type: number
          maxItems: 2
          minItems: 2
          type: array
        end_of_epoch:
          type: boolean
        is_most_conclusive:
          description: Indicates that this is the best performing variant for this metric. Also referred to as the 'Winner'
          type: boolean
        is_significant:
          description: Indicates if significance is above your confidence threshold
          type: boolean
        lift_status:
          description: Indicates whether a variation is doing better/worse than the baseline after taking the metric's winning direction into account.
          enum:
          - equal
          - better
          - worse
          type: string
        significance:
          description: The likelihood that the observed difference in conversion rate is not due to chance
          format: double
          type: number
        value:
          description: The estimated improvement for this variant compared to the baseline
          format: double
          type: number
        value_scaled:
          description: The estimated improvement scaled by the baseline conversion rate.
          format: double
          type: number
        visitors_remaining:
          description: The number of estimated visitors remaining before result becomes statistically significant. A value of 9223372036854775807 means the value is not available.
          format: int64
          type: integer
      type: object
