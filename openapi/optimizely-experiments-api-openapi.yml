          type: object
        variation_id:
          description: The unique identifier for the variation
          format: int64
          readOnly: true
          type: integer
        weight:
          description: The percentage of your visitors that should see this variation, measured in basis points. 100 basis points = 1% traffic. Variation weights must add up to 10000.
          maximum: 10000
          minimum: 0
          type: integer
      required:
      - weight
      type: object
    ChangeAttribute:
      properties:
        class:
          description: Name of the class to set the element(s) matched by a selector to
          example: intro
          type: string
        hide:
          description: Whether or not to hide the element(s) matched by a selector
          type: boolean
        href:
          description: Value of href attribute to add to element(s) matched by a selector
          example: example.com
          type: string
        html:
          description: Value of HTML attribute to add to element(s) matched by a selector
          example: New Title
          type: string
        remove:
          description: Whether or not to remove the element(s) matched by a selector
          type: boolean
        src:
          description: Value of src attribute to add to element(s) matched by a selector
          example: song.mp3
          type: string
        style:
          description: Value of style attribute to add to element(s) matched by a selector
          example: background-color:blue;
          type: string
        text:
          description: Value of text attribute to add to the element(s) matched by a selector
          example: Some nice message
          type: string
      type: object
    Change:
      properties:
        allow_additional_redirect:
          description: Whether or not to allow additional redirects after redirecting to destination. Required for changes of type 'redirect'
          type: boolean
        async:
          description: Indicates whether or not to execute the change asyncronously. If true, src will be returned in the response. Otherwise, it will be not included.
          type: boolean
        attributes:
          $ref: '#/components/schemas/ChangeAttribute'
        config:
          description: Configuration properties for the extension
          example: '{"name": "Flash Sale Today!", "color": "blue"}'
          type: object
        css:
          $ref: '#/components/schemas/CSSAttribute'
        dependencies:
          description: A list of dependent change IDs that must happen before this change
          example:
          - ad1f6acb-78f2-4653-b955-913abd777e16
          - ad20a6dd-2083-4964-8ed2-f0dc7baef687
          items:
            format: uuid
            type: string
          type: array
        destination:
          description: URL to redirect to. Required for changes of type 'redirect'. `destination` and `destination_function` cannot be used at the same time
          example: https://app.optimizely.com/
          type: string
        destination_function:
          description: A function string to redirect to. Required for changes of type 'redirect'. `destination` and `destination_function` cannot be used at the same time
          example: https://app.optimizely.com/
          type: string
        extension_id:
          description: ID of the extension to insert. Required for changes of type 'extension'
          readOnly: true
          type: string
        id:
          description: The ID of the change
          format: uuid
          readOnly: true
          type: string
        name:
          description: Name of the change
          example: Setting button text
          type: string
        operator:
          description: Where to instert HTML or image for types 'insert_html' and 'insert_image' with respect to the element(s) matched by 'selector'
          example: after
          type: string
        preserve_parameters:
          description: Whether or not to preserve parameters from original request when redirecting to new destination URL. Required for changes of type 'redirect'. For redirects using `destination_function`, `preserve_parameters` must be false.
          type: boolean
        rearrange:
          description: A directive to place the DOM element(s) matched by 'selector' to the position of the element matched by 'insertSelector', with the relation specified by 'operator'. The supplied example moves element matched by 'selector' above the element of class .greyBox
          example: '{"insertSelector": ".greyBox", "operator": "before"}'
          type: object
        selector:
          description: CSS selector to determine where changes are applied. Required for changes of type 'attribute', 'insert_html', and 'insert_image'
          example: a[href*="optimizely"]
          type: string
        src:
          description: The path to the change payload on the CDN. Only present if 'async' is True.
          readOnly: true
          type: string
        type:
          description: 'The type of this change.

            - Changes of type ''attribute'' have required fields ''selector'' and ''attributes''

            - Changes of type ''custom_code'' have required field ''value''

            - Changes of type ''custom_css'' have required field ''value''

            - Changes of type ''extension'' have required field ''extension_id''

            - Changes of type ''insert_html'' have required field ''selector''

            - Changes of type ''insert_image'' have required field ''selector''

            - Changes of type ''redirect'' have required fields ''destination'', ''preserve_parameters'', and ''allow_additional_redirect''

            '
          enum:
          - attribute
          - custom_code
          - custom_css
          - extension
          - insert_html
          - insert_image
          - redirect
          type: string
        value:
          description: The value for the change can be custom Javascript or CSS as a string. Required for changes of type 'custom_css' and 'custom_code'
          example: window.someGlobalFunction();
          type: string
      required:
      - type
      type: object
    VariationUpdate:
      example:
        actions:
        - changes:
          - allow_additional_redirect: true
            async: true
            attributes:
              class: new_class
              style: background-color:blue
              text: Some nice message
            selector: '#my_div'
            type: attribute
          page_id: 5678
        variation_id: 1234
        weight: 5000
      properties:
        actions:
          description: A collection of changes to run for each page in an experiment. Only applicable to Optimizely X Web.
          items:
            $ref: '#/components/schemas/Action'
          type: array
        archived:
          description: Whether the variation is archived
          type: boolean
        description:
          description: A description for the variation.
          example: Change the CTA button background color from green to blue.
          type: string
        feature_enabled:
          description: For Feature Tests, indicates if the feature should be enabled for the variation
          type: boolean
        key:
          description: Unique string identifier for this variation within the Experiment. Only applicable for Full Stack and Mobile projects.
          example: blue_button_variation
          maxLength: 64
          pattern: ^[a-zA-Z0-9_\-]+$
          type: string
        name:
          description: The name of the variation. Required for Web Experiments and Personalization experiences. Not required for Full Stack Experiments.
          example: Blue Button
          type: string
        status:
          description: Current status of the variation
          enum:
          - active
          - paused
          - archived
          type: string
        variable_values:
          additionalProperties:
            type: string
          description: For Feature Tests, the variable values for the variation represented as a map of Variable keys to their values.
          type: object
        variation_id:
          description: An immutable unique identifier for the variation. Required to update an existing variation.
          format: int64
          type: integer
        weight:
          description: The percentage of your visitors that should see this variation, measured in basis points. 100 basis points = 1% traffic. Variation weights must add up to 10000.
          maximum: 10000
          minimum: 0
          type: integer
      required:
      - weight
      type: object
    VariationReach:
      properties:
        count:
          description: Total number of visitors exposed to this particular variation
          format: int64
          type: integer
        name:
          description: The name of the variation
          example: Blue Button
          type: string
        variation_id:
          description: The unique identifier for the variation
          type: string
        variation_reach:
          format: double
          type: number
      type: object
    URLTargeting:
