          description: The time zone to use for Experiment start and stop times with respect to an IANA time zone (ex. "America/New_York"). The time zones expressed by GMT (e.g. "GMT-08:00") are no longer supported.
          example: America/New_York
          pattern: ^[A-Za-z\-\_\/]+$
          type: string
