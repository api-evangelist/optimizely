      type: object
    ResultsShareLink:
      properties:
        url:
          description: The share link for the results of this Campaign
          format: url
          readOnly: true
          type: string
      type: object
    CompoundSubMetric:
      description: A metric that is used only as part of the calculation for a ratio metric.
      properties:
        aggregator:
          default: unique
          description: The aggregation function for the numerator of the metric. 'unique' measures the number of unique visitors/sessions that include the specified Event. 'count' measures the total number of occurrences of Event for the scope (visitor/session). 'sum' is the sum of the 'field' value.
          enum:
          - unique
          - count
          - sum
          type: string
        event_id:
          description: The ID for the Event to select data from.
          format: int64
          type:
          - integer
          - 'null'
        event_type:
          description: The type of this Event.
          enum:
          - custom
          - click
          - pageview
          type: string
        field:
          description: The field to aggregate for the numerator of the metric. Required when 'aggregator' = 'sum', otherwise omitted.
          enum:
          - revenue
          - value
          type:
          - string
          - 'null'
        scope:
          default: visitor
          description: Specifies how Events should be grouped. Can also be thought of as the denominator of the metric. 'session' divides by the number of sessions. "Influenced sessions", or sessions that do not contain a decision Event but carry a decision from a previous session are not included in counts for numerator or denominator. 'visitor' divides by the number of visitors. 'event' divides by the total occurrences (impressions) of the specified Event.
          enum:
          - session
          - visitor
          - event
          type: string
      type: object
    TimeseriesDatapoint:
      properties:
        lift:
          $ref: '#/components/schemas/Datapoint'
        rate:
          description: The value of the metric after dividing the numerator value over the denominator value
          format: double
          type: number
        samples:
          description: The value of the denominator
          format: int64
          type: number
        time:
          description: Time of this data point formatted in ISO 8601
          format: date-time
          type: string
        value:
          description: The value of the numerator
          format: int64
          type: number
        variance:
          description: The variance of the metric value
          format: double
          type: number
      type: object
    ExperimentEnvironmentUpdate:
      properties:
        status:
          description: Update the Experiment's status in different Environments based on the environment key.
          enum:
          - not_started
          - running
          - paused
          type: string
      required:
      - status
      type: object
  parameters:
    experimentId:
      name: experiment_id
      in: path
      required: true
      description: The unique identifier for the experiment
      schema:
        type: integer
        format: int64
    projectIdQuery:
      name: project_id
      in: query
      required: true
      description: The unique identifier for the project to filter by
      schema:
        type: integer
        format: int64
    page:
      name: page
      in: query
      required: false
      description: Page number for pagination
      schema:
        type: integer
        default: 1
        minimum: 1
    perPage:
      name: per_page
      in: query
      required: false
      description: Number of results per page
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    attribute_id_segment:
      description: 'ID of the attribute to segment results by. Requests containing attribute_id will return the results for all visitors that have attribute_value for the attribute represented by attribute_id. If present, the attribute_value parameter must also be present, and it cannot be sent with any other segmentation parameters, i.e. any parameters in [browser, device, source].

        '
      in: query
      name: attribute_id
      schema:
        format: int64
        type: integer
    page_2:
      description: 'Optional pagination argument that specifies the page to return. If you have 140 objects and you choose to return 100 objects per page you will be able to access the last 40 objects on page 2. The default value is 1.

        '
      in: query
      name: page
      required: false
      schema:
        default: 1
        type: integer
    source_segment:
      description: 'Source to segment results by. This parameter must not be sent with any other segmentation parameters, i.e. any parameters in [browser, device, attribute_id, attribute_value].

        Campaign: Contains users that arrive on a URL containing a ''utm_campaign,'' ''utm_source,'' ''gclid,'' or ''otm_source'' query parameter. If the URL contains one of these parameters, the visitor will count as "Campaign" traffic even if they arrived through search.

        Direct:  Includes all users who do not have any external referrer in their URL.

        Referral: Includes all users that come from another URL that doesn''t count as Campaign.

        '
      in: query
      name: source
      schema:
        enum:
        - campaign
        - direct
        - referral
        - search
