            $ref: '#/components/schemas/Metric_2'
          type: array
        name:
          description: Name of the Experiment
          example: Blue Button Experiment
          type: string
        page_ids:
          description: A list of Page IDs used in the Experiment.  Only `url_targeting` or `page_ids` can be used when updating an experiment, but not both.
          items:
            format: int64
            type: integer
          type: array
        schedule:
          $ref: '#/components/schemas/ScheduleUpdate'
        traffic_allocation:
          description: Percent of traffic allocated for the experiment, measured in basis points. 100 basis points = 1% traffic. For example, a value of 5500 would mean that 55% of visitors will be eligible for the experiment. This is only applicable for Full Stack.
          example: 5000
          maximum: 10000
          minimum: 0
          type: integer
        url_targeting:
          $ref: '#/components/schemas/URLTargeting'
        variations:
          description: List of IDs of all variations in the Experiment
          items:
            $ref: '#/components/schemas/VariationUpdate'
          type: array
        whitelist:
          description: A list containing the user IDs and variations of users who have been whitelisted
          items:
            properties:
              user_id:
                description: The ID of the user being whitelisted
                example: user_1
