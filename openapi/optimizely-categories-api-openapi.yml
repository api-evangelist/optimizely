components:
  schemas:
    Insite.Data.Entities.Category:
      required:
      - erpProductValues
      - imageAltText
      - largeImagePath
      - metaDescription
      - metaKeywords
      - name
      - pageTitle
      - shortDescription
      - smallImagePath
      - urlSegment
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        activateOn:
          format: date-time
          type: string
        contentManagerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        deactivateOn:
          format: date-time
          type: string
        erpProductValues:
          type: string
        imageAltText:
          maxLength: 1024
          minLength: 0
          type: string
        isDynamic:
          type: boolean
        isFeatured:
          type: boolean
        largeImagePath:
          maxLength: 1024
          minLength: 0
          type: string
        metaDescription:
          type: string
        metaKeywords:
          type: string
        name:
          maxLength: 255
          minLength: 0
          type: string
        pageTitle:
          maxLength: 1024
          minLength: 0
          type: string
        parentId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        ruleManagerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        shortDescription:
          maxLength: 255
          minLength: 0
          type: string
        showDetail:
          type: boolean
        smallImagePath:
          maxLength: 1024
          minLength: 0
          type: string
        sortOrder:
          format: int32
          type: integer
        searchBoost:
          format: decimal
          type: number
        productSearchBoost:
          format: decimal
          type: number
        urlSegment:
          maxLength: 255
          minLength: 0
          type: string
        websiteId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        openGraphTitle:
          maxLength: 2048
          minLength: 0
          type: string
        openGraphUrl:
          maxLength: 2048
          minLength: 0
          type: string
        openGraphImage:
          maxLength: 1024
          minLength: 0
          type: string
        mobileBannerImageUrl:
          maxLength: 1024
          minLength: 0
