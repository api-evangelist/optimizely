components:
  schemas:
    Insite.Data.Entities.OrderStatusMapping:
      required:
      - erpOrderStatus
      - displayName
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        erpOrderStatus:
          maxLength: 50
          minLength: 0
          type: string
        displayName:
          maxLength: 50
          minLength: 0
          type: string
        isDefault:
          type: boolean
        allowRma:
          type: boolean
        allowCancellation:
          type: boolean
        odpActionType:
          maxLength: 50
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
