components:
  schemas:
    Insite.Data.Entities.BrandCategoryImage:
      required:
      - imageSource
      - dynamicImagePath
      - dynamicImageAltText
      - manualImagePath
      - manualImageAltText
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        brandId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        categoryId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        websiteId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        imageSource:
          maxLength: 1024
          minLength: 0
          type: string
        manualImageProductId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        dynamicImagePath:
          maxLength: 1024
          minLength: 0
          type: string
        dynamicImageAltText:
          maxLength: 2048
          minLength: 0
          type: string
        manualImagePath:
          maxLength: 1024
          minLength: 0
          type: string
        manualImageAltText:
          maxLength: 2048
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
