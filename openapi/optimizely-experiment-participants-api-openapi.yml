components:
  schemas:
    Insite.Data.Entities.ExperimentParticipant:
      required:
      - deviceType
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        experimentId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        contentKey:
          format: int32
          type: integer
        orderPlaced:
          type: boolean
        orderSubtotal:
          format: decimal
          type: number
        numberOfOrderLines:
          format: int32
          type: integer
        isBounced:
          type: boolean
        addedToCartFromTrackedElement:
          type: boolean
        deviceType:
          maxLength: 50
          minLength: 0
          type: string
        trackedElementClicked:
          type: boolean
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
