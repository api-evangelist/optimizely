components:
  schemas:
    Insite.Data.Entities.ContentItemField:
      required:
      - deviceType
      - fieldType
      - fieldName
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        contentKey:
          format: int32
          type: integer
        languageId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        personaId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        deviceType:
          maxLength: 50
          minLength: 0
          type: string
        fieldType:
          maxLength: 50
          minLength: 0
          type: string
        fieldName:
          maxLength: 100
          minLength: 0
          type: string
        isSharedField:
          type: boolean
        dateTimeValue:
          format: date-time
          type: string
        decimalValue:
          format: double
          type: number
        intValue:
          format: int32
          type: integer
        stringValue:
          type: string
        booleanValue:
          type: boolean
        objectValue:
          format: byte
          type: string
        publishOn:
          format: date-time
          type: string
        approvedOn:
          format: date-time
          type: string
        submittedForApprovalOn:
          format: date-time
          type: string
        createdById:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        approvedById:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        isRetracted:
          type: boolean
        isRollback:
          type: boolean
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
