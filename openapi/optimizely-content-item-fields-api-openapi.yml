  /api/v1/admin/contentitemfields/delete:
    delete:
      tags:
      - Content Item Fields
      operationId: ContentItemFields_DeleteRoute
      parameters:
      - name: ids
        in: query
        required: true
        explode: true
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
