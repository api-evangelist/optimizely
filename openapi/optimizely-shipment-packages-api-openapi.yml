components:
  schemas:
    Insite.Data.Entities.ShipmentPackage:
      required:
      - packageNumber
      - carrier
      - trackingNumber
      - shipVia
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        shipmentId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        packageNumber:
          maxLength: 100
          minLength: 0
          type: string
        carrier:
          maxLength: 100
          minLength: 0
          type: string
        trackingNumber:
          maxLength: 50
          minLength: 0
          type: string
        freight:
          format: decimal
          type: number
        shipVia:
          maxLength: 100
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
