components:
  requestBodies:
    Affiliates_ArchiveParameters:
      content:
        application/json:
          schema:
            type: object
            properties: {}
      description: archive action parameters
  schemas:
    Insite.Data.Entities.ShipVia:
      required:
      - description
      - erpShipCode
      - shipCode
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        activateOn:
          format: date-time
          type: string
        allowScheduledShipDate:
          type: boolean
        carrierId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        chargeAmount:
          format: decimal
          type: number
        deactivateOn:
          format: date-time
          type: string
        description:
          maxLength: 100
          minLength: 0
          type: string
        enable:
          type: boolean
        erpShipCode:
          maxLength: 50
          minLength: 0
          type: string
        flatFee:
          format: decimal
          type: number
        isDefault:
          type: boolean
        minimumFee:
          format: decimal
          type: number
        shipCode:
          maxLength: 50
          minLength: 0
          type: string
        ruleManagerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        isPickup:
          type: boolean
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
