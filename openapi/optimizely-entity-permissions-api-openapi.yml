components:
  schemas:
    Insite.Data.Entities.EntityPermission:
      required:
      - roleName
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        entityConfigurationId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        canView:
          type: boolean
        canEdit:
          type: boolean
        canCreate:
          type: boolean
        canDelete:
          type: boolean
        roleName:
          maxLength: 256
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
