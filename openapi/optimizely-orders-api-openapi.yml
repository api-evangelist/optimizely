openapi: 3.2.0
info:
  title: Optimizely Orders API
  version: '1.0'
  description: 'Operations tagged Orders across 3 of this provider''s published API definitions: optimizely-commerce-service-openapi.yml, optimizely-configured-commerce-storefront-api-v1-openapi.json, optimizely-data-platform-orders-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: '{siteUrl}/episerverapi'
  description: Optimizely Commerce Service API endpoint
  variables:
    siteUrl:
      default: https://www.example.com
      description: The base URL of the Optimizely Commerce site
- url: https://dogfood.commerce.insitesandbox.com
- url: https://api.us1.odp.optimizely.com/v3
  description: United States
- url: https://api.eu1.odp.optimizely.com/v3
  description: Europe
- url: https://api.au1.odp.optimizely.com/v3
  description: Asia-Pacific
tags:
- name: Orders
  description: Manage purchase orders, cart operations, and order workflows.
paths:
  /commerce/orders/{customerId}/all:
    get:
      operationId: listCustomerOrders
      summary: List customer orders
      description: Returns all orders for a specific customer.
      tags:
      - Orders
      parameters:
      - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          description: Successfully retrieved customer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Customer not found
      security:
      - bearerAuth: []
    servers:
    - url: '{siteUrl}/episerverapi'
      description: Optimizely Commerce Service API endpoint
      variables:
        siteUrl:
          default: https://www.example.com
          description: The base URL of the Optimizely Commerce site
  /commerce/orders/{orderGroupId}:
    get:
      operationId: getOrder
      summary: Get an order
      description: Retrieves a specific order by its order group identifier.
      tags:
      - Orders
      parameters:
      - $ref: '#/components/parameters/orderGroupId'
      responses:
        '200':
          description: Successfully retrieved the order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Authentication credentials are missing or invalid
        '404':
          description: Order not found
      security:
      - bearerAuth: []
    servers:
    - url: '{siteUrl}/episerverapi'
      description: Optimizely Commerce Service API endpoint
      variables:
        siteUrl:
          default: https://www.example.com
          description: The base URL of the Optimizely Commerce site
  /commerce/orders/search/{start}/{maxCount}:
    get:
      operationId: searchOrders
      summary: Search orders
      description: Searches for orders with pagination support.
      tags:
      - Orders
      parameters:
      - name: start
        in: path
        required: true
        description: Starting index for results
        schema:
          type: integer
          minimum: 0
      - name: maxCount
        in: path
        required: true
        description: Maximum number of results to return
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Successfully retrieved search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Authentication credentials are missing or invalid
      security:
      - bearerAuth: []
    servers:
    - url: '{siteUrl}/episerverapi'
      description: Optimizely Commerce Service API endpoint
      variables:
        siteUrl:
          default: https://www.example.com
          description: The base URL of the Optimizely Commerce site
  /api/v1/orders:
    get:
      tags:
      - Orders
      operationId: OrdersV1_GetCollectionAsync
      parameters:
      - name: parameter.orderNumber
        in: query
        required: false
        schema:
          type: string
      - name: parameter.poNumber
        in: query
        required: false
        schema:
          type: string
      - name: parameter.search
        in: query
        required: false
        schema:
          type: string
      - name: parameter.status
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: parameter.customerSequence
        in: query
        required: false
        schema:
          type: string
      - name: parameter.fromDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: parameter.toDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: parameter.orderTotalOperator
        in: query
        required: false
        schema:
          type: string
      - name: parameter.orderTotal
        in: query
        required: false
        schema:
          type: number
          format: decimal
      - name: parameter.productErpNumber
        in: query
        required: false
        schema:
          type: string
      - name: parameter.currentPage
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: parameter.page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: parameter.pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: parameter.sort
        in: query
        required: false
        schema:
          type: string
      - name: parameter.vmiOrdersOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: parameter.vmiLocationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: parameter.vmiBinId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: parameter.showMyOrders
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderCollectionModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderCollectionModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderCollectionModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderCollectionModel'
            text/html:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderCollectionModel'
      security:
      - access_token: []
    servers:
    - url: https://dogfood.commerce.insitesandbox.com
  /api/v1/orders/{orderId}:
    get:
      tags:
      - Orders
      operationId: OrdersV1_GetAsync
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
            text/html:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
    patch:
      tags:
      - Orders
      operationId: OrdersV1_PatchAsync
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
          text/xml:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
          text/html:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
            text/html:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
      security:
      - access_token: []
    servers:
    - url: https://dogfood.commerce.insitesandbox.com
  /api/v1/orders/{orderId}/returns:
    post:
      tags:
      - Orders
      operationId: OrdersV1_PostRmaAsync
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.RmaModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.RmaModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.RmaModel'
          text/xml:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.RmaModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.RmaModel'
          text/html:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.RmaModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.RmaModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.RmaModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.RmaModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.RmaModel'
            text/html:
              schema:
                $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.RmaModel'
      security:
      - access_token: []
    servers:
    - url: https://dogfood.commerce.insitesandbox.com
  /api/v1/orders/shareorder:
    post:
      tags:
      - Orders
      operationId: OrdersV1_Post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.ShareOrderModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.ShareOrderModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.ShareOrderModel'
          text/xml:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.ShareOrderModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.ShareOrderModel'
          text/html:
            schema:
              $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.ShareOrderModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insite.Email.WebApi.V1.ApiModels.ShareEntityModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Insite.Email.WebApi.V1.ApiModels.ShareEntityModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/Insite.Email.WebApi.V1.ApiModels.ShareEntityModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/Insite.Email.WebApi.V1.ApiModels.ShareEntityModel'
            text/html:
              schema:
                $ref: '#/components/schemas/Insite.Email.WebApi.V1.ApiModels.ShareEntityModel'
    servers:
    - url: https://dogfood.commerce.insitesandbox.com
  /events:
    post:
      tags:
      - Orders
      summary: Order Purchase/Return/Refund/Cancellation
      description: Upload an order purchase/return/refund/cancellation event to Optimizely Data Platform (ODP).
      operationId: order-returnrefund
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Event'
            examples:
              Order Purchase Example Payload:
                description: Order Purchase Example Payload
                value:
                - type: order
                  action: purchase
                  identifiers:
                    email: bob@gmail.com
                  data:
                    ts: 123456789
                    order:
                      order_id: OR345
                      total: 109.65
                      discount: 5
                      subtotal: 103
                      tax: 5.15
                      shipping: 6.5
                      coupon_code: 5OFF
                      items:
                      - product_id: '2045'
                        price: 19
                        quantity: 5
                        discount: 0
                        subtotal: 95
                      - product_id: '2091'
                        price: 10
                        quantity: 1
                        discount: 2
                        subtotal: 8
              Order Return/Refund Example Payload:
                description: Order Return/Refund Example Payload
                value:
                - type: order
                  action: return
                  identifiers:
                    email: bob@gmail.com
                  data:
                    ts: 123456789
                    order:
                      order_id: OR345
                      total: -100
                      subtotal: -90
                      tax: 0
                      shipping: 0
                      items:
                      - product_id: '2045'
                        price: -9
                        quantity: 10
                        subtotal: -90
              Order Cancellation Example Payload:
                description: Order Cancellation Example Payload
                value:
                - type: order
                  action: cancel
                  identifiers:
                    email: bob@gmail.com
                  data:
                    ts: 123456789
                    order:
                      order_id: OR345
                      total: -100
                      items:
                      - product_id: '2045'
                        price: -10
                        quantity: 10
                        subtotal: -100
              Partial Refund Example Payload:
                description: Partial Refund Example Payload
                value:
                - identifiers:
                    email: bob@thebuyer.com
                  type: order
                  action: refund
                  data:
                    order:
                      order_id: ABC
                      total: 10
                      subtotal: 10
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericUpdateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                example: '{"title":"Bad Request","status":400,"timestamp":"2018-09-10T21:07:10-05:00","detail":{"invalids":[{"field":"delimiter","reason":"Unrecognized delimiter, valid options are comma, tab or pipe"}]}}'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                example: '{  "message": "Forbidden"}'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                example: '{"title":"Bad Request","status":404,"timestamp":"2018-09-10T21:07:10-05:00","detail":{"message":"Not found description"}}'
      security:
      - x-api-key: []
    servers:
    - url: https://api.us1.odp.optimizely.com/v3
      description: United States
    - url: https://api.eu1.odp.optimizely.com/v3
      description: Europe
    - url: https://api.au1.odp.optimizely.com/v3
      description: Asia-Pacific
components:
  parameters:
    orderGroupId:
      name: orderGroupId
      in: path
      required: true
      description: The unique identifier for the order group
      schema:
        type: integer
        format: int64
    customerId:
      name: customerId
      in: path
      required: true
      description: The unique identifier for the customer
      schema:
        type: string
  schemas:
    Order:
      type: object
      description: A purchase order
      properties:
        order_group_id:
          type: integer
          format: int64
          description: Unique order group identifier
        customer_id:
          type: string
          description: Customer identifier
        customer_name:
          type: string
          description: Customer name
        status:
          type: string
          description: Current order status
        total:
          type: number
          description: Order total amount
        currency:
          type: string
          description: Currency code
        created:
          type: string
          format: date-time
          description: Timestamp when the order was created
        modified:
          type: string
          format: date-time
          description: Timestamp when the order was last modified
        order_forms:
          type: array
          description: Order forms containing line items
          items:
            type: object
            properties:
              line_items:
                type: array
                description: Line items in the order form
                items:
                  type: object
                  properties:
                    catalog_entry_id:
                      type: string
                      description: Catalog entry code
                    display_name:
                      type: string
                      description: Display name of the item
                    quantity:
                      type: number
                      description: Quantity ordered
                    placed_price:
                      type: number
                      description: Price at time of purchase
    Insite.Order.WebApi.V1.ApiModels.OrderPromotionModel:
      type: object
      properties:
        uri:
          type: string
        id:
          type: string
        amount:
          format: double
          type: number
        amountDisplay:
          type: string
        name:
          type: string
        orderHistoryLineId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        promotionResultType:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
    Insite.Core.WebApi.SortOptionModel:
      type: object
      properties:
        displayName:
          type: string
        sortType:
          type: string
    Insite.Order.Services.Dtos.SectionOptionDto:
      type: object
      properties:
        sectionOptionId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        sectionName:
          type: string
        optionName:
          type: string
    Insite.Order.WebApi.V1.ApiModels.ShareOrderModel:
      type: object
      properties:
        uri:
          type: string
        stEmail:
          type: string
        stPostalCode:
          type: string
        emailTo:
          type: string
        emailFrom:
          type: string
        subject:
          type: string
        message:
          type: string
        entityId:
          type: string
        entityName:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
    Insite.Order.Services.Dtos.RmaLineDto:
      type: object
      properties:
        line:
          format: decimal
          type: number
        rmaQtyRequested:
          format: int32
          type: integer
        rmaReasonCode:
          type: string
    Insite.Email.WebApi.V1.ApiModels.ShareEntityModel:
      type: object
      properties:
        uri:
          type: string
        emailTo:
          type: string
        emailFrom:
          type: string
        subject:
          type: string
        message:
          type: string
        entityId:
          type: string
        entityName:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
    Insite.Catalog.Services.Dtos.BrandDto:
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
        urlSegment:
          type: string
        logoSmallImagePath:
          type: string
        logoLargeImagePath:
          type: string
        logoImageAltText:
          type: string
        detailPagePath:
          type: string
    Insite.Order.Services.Dtos.OrderHistoryTaxDto:
      type: object
      properties:
        taxCode:
          type: string
        taxDescription:
          type: string
        taxRate:
          format: decimal
          type: number
        taxAmount:
          format: decimal
          type: number
        taxAmountDisplay:
          type: string
        sortOrder:
          format: int32
          type: integer
    Insite.Catalog.Services.Dtos.AvailabilityDto:
      type: object
      properties:
        messageType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          type: integer
        message:
          type: string
        requiresRealTimeInventory:
          type: boolean
    Insite.Order.WebApi.V1.ApiModels.OrderCollectionModel:
      type: object
      properties:
        uri:
          type: string
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Insite.Order.WebApi.V1.ApiModels.OrderModel'
        pagination:
          $ref: '#/components/schemas/Insite.Core.WebApi.PaginationModel'
        showErpOrderNumber:
          type: boolean
        properties:
          type: object
          additionalProperties:
            type: string
    Insite.Core.WebApi.PaginationModel:
      type: object
      properties:
        currentPage:
          format: int32
          type: integer
        page:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        defaultPageSize:
          format: int32
          type: integer
        totalItemCount:
          format: int32
          type: integer
        numberOfPages:
          format: int32
          type: integer
        pageSizeOptions:
          type: array
          items:
            format: int32
            type: integer
        sortOptions:
          type: array
          items:
            $ref: '#/components/schemas/Insite.Core.WebApi.SortOptionModel'
        sortType:
          type: string
        nextPageUri:
          type: string
        prevPageUri:
          type: string
        nextPageToken:
          type: string
    Insite.Order.Services.Dtos.ShipmentPackageDto:
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        shipmentDate:
          format: date-time
          type: string
        packageNumber:
          type: string
        carrier:
          type: string
        shipVia:
          type: string
        trackingUrl:
          type: string
        trackingNumber:
          type: string
        packSlip:
          type: string
        shipmentPackageLineDtos:
          type: array
          items:
            $ref: '#/components/schemas/Insite.Order.Services.Dtos.ShipmentPackageLineDto'
    Insite.Order.WebApi.V1.ApiModels.OrderLineModel:
      type: object
      properties:
        uri:
          type: string
        id:
          type: string
        productId:
          type: string
        productUri:
          type: string
        mediumImagePath:
          type: string
        altText:
          type: string
        productName:
          type: string
        manufacturerItem:
          type: string
        customerName:
          type: string
        shortDescription:
          type: string
        productErpNumber:
          type: string
        customerProductNumber:
          type: string
        requiredDate:
          format: date-time
          type: string
        lastShipDate:
          format: date-time
          type: string
        customerNumber:
          type: string
        customerSequence:
          type: string
        lineType:
          type: string
        status:
          type: string
        lineNumber:
          format: decimal
          type: number
        releaseNumber:
          format: decimal
          type: number
        linePOReference:
          type: string
        description:
          type: string
        warehouse:
          type: string
        notes:
          type: string
        qtyOrdered:
          format: decimal
          type: number
        qtyShipped:
          format: decimal
          type: number
        unitOfMeasure:
          type: string
        unitOfMeasureDisplay:
          type: string
        unitOfMeasureDescription:
          type: string
        availability:
          $ref: '#/components/schemas/Insite.Catalog.Services.Dtos.AvailabilityDto'
        inventoryQtyOrdered:
          format: decimal
          type: number
        inventoryQtyShipped:
          format: decimal
          type: number
        unitPrice:
          format: decimal
          type: number
          readOnly: true
        unitNetPrice:
          format: decimal
          type: number
        extendedUnitNetPrice:
          format: decimal
          type: number
        discountPercent:
          format: decimal
          type: number
        discountAmount:
          format: decimal
          type: number
          readOnly: true
