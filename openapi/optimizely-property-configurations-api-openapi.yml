components:
  schemas:
    Insite.Data.Entities.PropertyConfiguration:
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        controlType:
          maxLength: 2048
          minLength: 0
          type: string
        propertyType:
          maxLength: 2048
          minLength: 0
          type: string
        entityConfigurationId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        hintText:
          maxLength: 2048
          minLength: 0
          type: string
        isRequired:
          type: boolean
        isTranslatable:
          type: boolean
        isCustomProperty:
          type: boolean
        label:
          maxLength: 256
          minLength: 0
          type: string
        name:
          maxLength: 256
          minLength: 0
          type: string
        parentProperty:
          maxLength: 256
          minLength: 0
          type: string
        hintTextPropertyName:
          maxLength: 256
          minLength: 0
          type: string
        canView:
          type: boolean
        canEdit:
          type: boolean
        toolTip:
          maxLength: 256
          minLength: 0
          type: string
        syncToPim:
          type: boolean
        isPii:
          type: boolean
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
