components:
  schemas:
    Insite.Data.Entities.TranslationProperty:
      required:
      - parentTable
      - name
      - translatedValue
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        languageId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        parentTable:
          maxLength: 100
          minLength: 0
          type: string
        parentId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          maxLength: 50
          minLength: 0
          type: string
        translatedValue:
          maxLength: 2048
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
