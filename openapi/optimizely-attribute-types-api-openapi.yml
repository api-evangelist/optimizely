components:
  schemas:
    Insite.Data.Entities.AttributeType:
      required:
      - label
      - name
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        isActive:
          type: boolean
        isComparable:
          type: boolean
        isFilter:
          type: boolean
        isSearchable:
          type: boolean
        includeOnProduct:
          type: boolean
        label:
          maxLength: 1024
          minLength: 0
          type: string
        name:
          maxLength: 255
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  requestBodies:
    Affiliates_ArchiveParameters:
      content:
        application/json:
          schema:
            type: object
            properties: {}
      description: archive action parameters
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
