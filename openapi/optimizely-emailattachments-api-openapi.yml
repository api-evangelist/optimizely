openapi: 3.2.0
info:
  version: storefront-v1
  title: Storefront API V1 Email Attachments API
servers:
- url: https://dogfood.commerce.insitesandbox.com
security: []
tags:
- name: EmailAttachments
paths:
  /api/v1/emailAttachments:
    get:
      tags:
      - EmailAttachments
      operationId: EmailAttachmentsV1_GetAsync
      parameters:
      - name: filename
        in: query
        required: true
        schema:
          type: string
      - name: key
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/html:
              schema:
                type: object
components:
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
