components:
  schemas:
    Insite.Data.Entities.InvoiceHistoryLine:
      required:
      - lineType
      - erpOrderNumber
      - productErpNumber
      - customerProductNumber
      - linePOReference
      - description
      - warehouse
      - notes
      - unitOfMeasure
      - shipmentNumber
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        invoiceHistoryId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        lineNumber:
          format: decimal
          type: number
        releaseNumber:
          format: decimal
          type: number
        lineType:
          maxLength: 50
          minLength: 0
          type: string
        erpOrderNumber:
          maxLength: 50
          minLength: 0
          type: string
        productErpNumber:
          maxLength: 50
          minLength: 0
          type: string
        customerProductNumber:
          maxLength: 50
          minLength: 0
          type: string
        linePOReference:
          maxLength: 50
          minLength: 0
          type: string
        description:
          type: string
        warehouse:
          maxLength: 50
          minLength: 0
          type: string
        notes:
          type: string
        qtyInvoiced:
          format: decimal
          type: number
        unitOfMeasure:
          maxLength: 50
          minLength: 0
          type: string
        unitPrice:
          format: decimal
          type: number
        discountPercent:
          format: decimal
          type: number
        discountAmount:
          format: decimal
          type: number
        lineTotal:
          format: decimal
          type: number
        taxRate:
          format: decimal
          type: number
        taxAmount:
          format: decimal
          type: number
        shipmentNumber:
          maxLength: 50
          minLength: 0
          type: string
        netPriceWithVat:
          format: decimal
          type: number
        unitPriceWithVat:
          format: decimal
          type: number
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
