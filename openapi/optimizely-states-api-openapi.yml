components:
  schemas:
    Insite.Data.Entities.State:
      required:
      - abbreviation
      - name
      - taxCode
      - taxCode2
      - taxDescription
      - taxDescription2
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        countryId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        abbreviation:
          maxLength: 50
          minLength: 0
          type: string
        handlingAmount:
          format: decimal
          type: number
        isActive:
          type: boolean
        name:
          maxLength: 100
          minLength: 0
          type: string
        taxable:
          type: boolean
        taxCode:
          maxLength: 50
          minLength: 0
          type: string
        taxCode2:
          maxLength: 50
          minLength: 0
          type: string
        taxFreight:
          type: boolean
        taxRate:
          format: decimal
          type: number
        taxRate2:
          format: decimal
          type: number
        taxDescription:
          maxLength: 100
          minLength: 0
          type: string
        taxDescription2:
          maxLength: 100
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  requestBodies:
    Affiliates_ArchiveParameters:
      content:
        application/json:
          schema:
            type: object
            properties: {}
      description: archive action parameters
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
