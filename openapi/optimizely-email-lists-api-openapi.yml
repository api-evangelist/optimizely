components:
  schemas:
    Insite.Data.Entities.EmailList:
      required:
      - name
      - description
      - subject
      - fromAddress
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          maxLength: 100
          minLength: 0
          type: string
        description:
          maxLength: 250
          minLength: 0
          type: string
        subject:
          maxLength: 250
          minLength: 0
          type: string
        fromAddress:
          maxLength: 100
          minLength: 0
          type: string
        emailTemplateId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        canSubscribe:
          type: boolean
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
