      - epi-hmac: []
      - Bearer: []
      - Basic: []
      parameters:
      - description: pinned collection id
        in: path
        name: collectionId
        required: true
        schema:
          type: string
      - description: pinned id (id)
        in: path
        name: id
        required: true
        schema:
          type: string
    servers:
