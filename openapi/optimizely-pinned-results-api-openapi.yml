      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinnedItemResult'
      description: Update a single pinned item
      summary: Update a pinned item
      tags:
      - 🏆 Pinned Results
      security:
      - epi-hmac: []
      - Bearer: []
      - Basic: []
      parameters:
      - description: pinned collection id
        in: path
        name: collectionId
        required: true
        schema:
          type: string
      - description: pinned id (id)
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinnedItemPayload'
    delete:
      operationId: delete-PinnedItemHandler
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinnedItemResult'
