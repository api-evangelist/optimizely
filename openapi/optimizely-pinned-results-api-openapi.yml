      description: Get pinned collections
      summary: Get pinned collection(s)
      tags:
      - 🏆 Pinned Results
      security:
      - epi-hmac: []
      - Bearer: []
      - Basic: []
      parameters:
      - in: query
        name: page
        required: false
        schema:
          format: double
          type: number
    post:
      operationId: create-PinnedCollectionHandler
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinnedCollectionResult'
      description: Register a pinned collection
      summary: Register a pinned collection
      tags:
      - 🏆 Pinned Results
      security:
      - epi-hmac: []
      - Bearer: []
      - Basic: []
      parameters: []
