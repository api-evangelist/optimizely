  /api/pinned/collections/{collectionId}:
    get:
      operationId: get-PinnedCollectionHandler
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinnedCollectionResult'
      description: Get collection by Id
      summary: Get pinned collection by Id
      tags:
      - 🏆 Pinned Results
      security:
      - epi-hmac: []
      - Bearer: []
      - Basic: []
      parameters:
      - description: Pinned collection id
        in: path
        name: collectionId
        required: true
        schema:
          type: string
    put:
      operationId: update-PinnedCollectionHandler
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinnedCollectionResult'
      description: Update pinned collection by Id
      summary: Update a pinned collection
      tags:
      - 🏆 Pinned Results
      security:
      - epi-hmac: []
      - Bearer: []
      - Basic: []
      parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: string
      requestBody:
