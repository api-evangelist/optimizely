                type: object
      deprecated: false
      security:
      - access_token: []
    put:
      tags:
      - Subscriptions
      summary: Replace entity in EntitySet Subscriptions
      operationId: Subscriptions_PutById
      parameters:
      - name: id
        in: path
        description: 'key: id'
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Insite.Data.Entities.Subscription'
        description: The entity to put
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      deprecated: false
      security:
      - access_token: []
    delete:
      tags:
      - Subscriptions
      summary: Delete entity in EntitySet Subscriptions
      operationId: Subscriptions_DeleteById
      parameters:
      - name: id
        in: path
        description: 'key: id'
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        description: If-Match header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      deprecated: false
      security:
      - access_token: []
    patch:
      tags:
      - Subscriptions
      summary: Update entity in EntitySet Subscriptions
      operationId: Subscriptions_PatchById
      parameters:
      - name: id
        in: path
        description: 'key: id'
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Insite.Data.Entities.Subscription'
        description: The entity to patch
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
