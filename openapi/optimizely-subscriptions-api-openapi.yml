components:
  requestBodies:
    Affiliates_ArchiveParameters:
      content:
        application/json:
          schema:
            type: object
            properties: {}
      description: archive action parameters
  schemas:
    Insite.Data.Entities.Subscription:
      required:
      - cyclePeriod
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        activateOn:
          format: date-time
          type: string
        allMonths:
          type: boolean
        april:
          type: boolean
        august:
          type: boolean
        customerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        customerOrderId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        cyclePeriod:
          maxLength: 50
          minLength: 0
          type: string
        deactivateOn:
          format: date-time
          type: string
        december:
          type: boolean
        february:
          type: boolean
        fixedPrice:
          type: boolean
        includeInInitialOrder:
          type: boolean
        january:
          type: boolean
        july:
          type: boolean
        june:
          type: boolean
        march:
          type: boolean
        may:
          type: boolean
        november:
          type: boolean
        october:
          type: boolean
        periodsPerCycle:
          format: int32
          type: integer
        productId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        september:
          type: boolean
        shipToId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        shipViaId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        totalCycles:
          format: int32
          type: integer
        userProfileId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        websiteId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
