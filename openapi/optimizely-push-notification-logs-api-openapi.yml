components:
  schemas:
    Insite.Data.Entities.PushNotificationLog:
      required:
      - firebaseMessageId
      - messagingErrorCode
      - errorMessage
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        deviceTokenId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        pushNotificationMessageId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        firebaseMessageId:
          maxLength: 100
          minLength: 0
          type: string
        messagingErrorCode:
          maxLength: 100
          minLength: 0
          type: string
        errorMessage:
          type: string
        deliveredDate:
          format: date-time
          type: string
        attemptedDateTime:
          format: date-time
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
