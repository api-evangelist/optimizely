components:
  schemas:
    Insite.Data.Entities.PunchOutSession:
      required:
      - fromIdentity
      - toIdentity
      - senderIdentity
      - fromUserAgent
      - buyerCookie
      - browserFormPost
      - domain
      - punchOutSessionMode
      - toIdentityNode
      - fromIdentityNode
      - senderIdentityNode
      - shipToAddressId
      - shipToName
      - shipToDeliverTo
      - shipToStreet
      - shipToCity
      - shipToState
      - shipToPostalCode
      - shipToIsoCountryCode
      - shipToCountry
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        userProfileId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        customerOrderId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        fromIdentity:
          maxLength: 255
          minLength: 0
          type: string
        toIdentity:
          maxLength: 255
          minLength: 0
          type: string
        senderIdentity:
          maxLength: 255
          minLength: 0
          type: string
        fromUserAgent:
          maxLength: 255
          minLength: 0
          type: string
        buyerCookie:
          maxLength: 255
          minLength: 0
          type: string
        browserFormPost:
          maxLength: 1024
          minLength: 0
          type: string
        domain:
          maxLength: 1024
          minLength: 0
          type: string
        punchOutSessionMode:
          maxLength: 50
          minLength: 0
          type: string
        toIdentityNode:
          maxLength: 1024
          minLength: 0
          type: string
        fromIdentityNode:
          maxLength: 1024
          minLength: 0
          type: string
        senderIdentityNode:
          maxLength: 1024
          minLength: 0
          type: string
        shipToAddressId:
          maxLength: 1024
          minLength: 0
          type: string
        shipToName:
          maxLength: 1024
          minLength: 0
          type: string
        shipToDeliverTo:
          maxLength: 1024
          minLength: 0
          type: string
        shipToStreet:
          maxLength: 1024
          minLength: 0
          type: string
        shipToCity:
          maxLength: 1024
          minLength: 0
          type: string
        shipToState:
          maxLength: 1024
          minLength: 0
          type: string
        shipToPostalCode:
          maxLength: 1024
          minLength: 0
          type: string
        shipToIsoCountryCode:
          maxLength: 1024
          minLength: 0
          type: string
        shipToCountry:
          maxLength: 1024
          minLength: 0
          type: string
        shipAddressIdResolved:
          type: boolean
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
