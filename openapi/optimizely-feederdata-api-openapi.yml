openapi: 3.2.0
info:
  version: storefront-v1
  title: Storefront API V1 Feederdata API
servers:
- url: https://dogfood.commerce.insitesandbox.com
security: []
tags:
- name: Feederdata
paths:
  /api/v1/feederdata/restrictionGroups/mostProducts:
    get:
      tags:
      - Feederdata
      operationId: FeederData_GetRestrictionGroup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/html:
              schema:
                type: object
  /api/v1/feederdata/customers/mostShipTos:
    get:
      tags:
      - Feederdata
      operationId: FeederData_GetCustomerWithMostShipTos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/html:
              schema:
                type: object
  /api/v1/feederdata/wishLists/mostProducts:
    get:
      tags:
      - Feederdata
      operationId: FeederData_GetWishlistWithMostProducts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/html:
              schema:
                type: object
  /api/v1/feederdata/product/mostWarehouses:
    get:
      tags:
      - Feederdata
      operationId: FeederData_GetProductWithMostWarehouses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/html:
              schema:
                type: object
  /api/v1/feederdata/quickorder/products:
    get:
      tags:
      - Feederdata
      operationId: FeederData_GetQuickOrderUploadProducts
      parameters:
      - name: count
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/html:
              schema:
                type: object
  /api/v1/feederdata/brands/mostProducts:
    get:
      tags:
      - Feederdata
      operationId: FeederData_GetBrandWithMostProducts
      parameters:
      - name: startLetter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/html:
              schema:
                type: object
components:
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
