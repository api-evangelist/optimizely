components:
  schemas:
    Insite.Data.Entities.RestrictionGroup:
      required:
      - name
      - description
      - displayType
      - validForWebsites
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          maxLength: 255
          minLength: 0
          type: string
        description:
          maxLength: 2048
          minLength: 0
          type: string
        displayType:
          maxLength: 50
          minLength: 0
          type: string
        isActive:
          type: boolean
        isLocationBased:
          type: boolean
        customerRuleManagerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        productRuleManagerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        affectedCustomers:
          format: int32
          type: integer
        affectedProducts:
          format: int32
          type: integer
        validForWebsites:
          maxLength: 50
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
