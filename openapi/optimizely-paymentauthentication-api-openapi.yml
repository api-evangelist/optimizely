      - access_token: []
  /api/v1/paymentauthentication/adyenpayment:
    post:
      tags:
      - Paymentauthentication
      operationId: PaymentAuthenticationV1_AdyenPayment
      requestBody:
        $ref: '#/components/requestBodies/PaymentAuthenticationV1_Post2Parameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/html:
              schema:
                type: object
      security:
      - access_token: []
  /api/v1/paymentauthentication/adyenrefund:
    post:
      tags:
      - Paymentauthentication
      operationId: PaymentAuthenticationV1_Refund
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenRefundParameter'
          text/json:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenRefundParameter'
          application/x-www-form-urlencoded:
