openapi: 3.2.0
info:
  version: storefront-v1
  title: Storefront API V1 Paymentauthentication API
servers:
- url: https://dogfood.commerce.insitesandbox.com
security: []
tags:
- name: Paymentauthentication
paths:
  /api/v1/paymentauthentication:
    post:
      tags:
      - Paymentauthentication
      operationId: PaymentAuthenticationV1_Post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.PaymentAuthenticationParameter'
          text/json:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.PaymentAuthenticationParameter'
          application/xml:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.PaymentAuthenticationParameter'
          text/xml:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.PaymentAuthenticationParameter'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.PaymentAuthenticationParameter'
          text/html:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.PaymentAuthenticationParameter'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.PaymentAuthenticationModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.PaymentAuthenticationModel'
            text/html:
              schema:
                $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.PaymentAuthenticationModel'
      security:
      - access_token: []
  /api/v1/paymentauthentication/threedsnotify:
    post:
      tags:
      - Paymentauthentication
      operationId: PaymentAuthenticationV1_Post2
      requestBody:
        $ref: '#/components/requestBodies/PaymentAuthenticationV1_Post2Parameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/html:
              schema:
                type: object
  /api/v1/paymentauthentication/adyenwebhook:
    post:
      tags:
      - Paymentauthentication
      operationId: PaymentAuthenticationV1_AdyenWebhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenWebhook.WebhookModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenWebhook.WebhookModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenWebhook.WebhookModel'
          text/xml:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenWebhook.WebhookModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenWebhook.WebhookModel'
          text/html:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenWebhook.WebhookModel'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/html:
              schema:
                type: object
  /api/v1/paymentauthentication/adyenpaymentdetails:
    post:
      tags:
      - Paymentauthentication
      operationId: PaymentAuthenticationV1_AdyenPaymentDetails
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenPaymentDetails.PaymentDetailsRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenPaymentDetails.PaymentDetailsRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenPaymentDetails.PaymentDetailsRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenPaymentDetails.PaymentDetailsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenPaymentDetails.PaymentDetailsRequest'
          text/html:
            schema:
              $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.AdyenPaymentDetails.PaymentDetailsRequest'
        required: true
