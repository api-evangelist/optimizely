  /api/v1/paymentauthentication/threedschallengeresponse:
    post:
      tags:
      - Paymentauthentication
      operationId: PaymentAuthenticationV1_PostAsync
      requestBody:
        $ref: '#/components/requestBodies/PaymentAuthenticationV1_Post2Parameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.ThreeDsChallengeResult'
            text/json:
              schema:
                $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.ThreeDsChallengeResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.ThreeDsChallengeResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.ThreeDsChallengeResult'
            text/html:
              schema:
                $ref: '#/components/schemas/Insite.Payments.WebApi.V1.ApiModels.ThreeDsChallengeResult'
  /api/v1/paymentauthentication/threedscallback:
    post:
      tags:
      - Paymentauthentication
      operationId: PaymentAuthenticationV1_PostAsync2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/html:
