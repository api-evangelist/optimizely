  /api/v1/paymentauthentication/bnplcallback:
    post:
      tags:
      - Paymentauthentication
      operationId: PaymentAuthenticationV1_BnplCallbackAsync
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
