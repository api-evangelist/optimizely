components:
  schemas:
    Insite.Data.Entities.OrderLine:
      required:
      - status
      - description
      - notes
      - unitOfMeasure
      - taxCode1
      - taxCode2
      - shipSite
      - customerPOLine
      - costCode
      - smartPart
      - configurationViewModel
      - configDataSet
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        customerOrderId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        line:
          format: int32
          type: integer
        release:
          format: int32
          type: integer
        productId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        websiteId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        status:
          maxLength: 50
          minLength: 0
          type: string
        description:
          maxLength: 2048
          minLength: 0
          type: string
        notes:
          type: string
        qtyOrdered:
          format: decimal
          type: number
        unitRegularPrice:
          format: decimal
          type: number
        unitNetPrice:
          format: decimal
          type: number
        unitOfMeasure:
          maxLength: 50
          minLength: 0
          type: string
        qtyShipped:
          format: decimal
          type: number
        taxCode1:
          maxLength: 50
          minLength: 0
          type: string
        taxCode2:
          maxLength: 50
          minLength: 0
          type: string
        dueDate:
          format: date-time
          type: string
        promiseDate:
          format: date-time
          type: string
        shipSite:
          maxLength: 50
          minLength: 0
          type: string
        shipDate:
          format: date-time
          type: string
        isPromotionItem:
          type: boolean
        promotionResultId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        customerPOLine:
          maxLength: 50
          minLength: 0
          type: string
        costCode:
          maxLength: 100
          minLength: 0
          type: string
        orderLineOtherCharges:
          format: decimal
          type: number
        taxAmount:
          format: decimal
          type: number
        totalRegularPrice:
          format: decimal
          type: number
        totalNetPrice:
          format: decimal
          type: number
        warehouseId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        unitListPrice:
          format: decimal
          type: number
        unitCost:
          format: decimal
          type: number
        smartPart:
          maxLength: 256
          minLength: 0
          type: string
        configurationViewModel:
          type: string
        configDataSet:
          type: string
        netPriceWithVat:
          format: decimal
          type: number
        unitPriceWithVat:
          format: decimal
          type: number
        vmiBinId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
