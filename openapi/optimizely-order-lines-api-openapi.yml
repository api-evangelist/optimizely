  /api/v1/admin/orderlines/delete:
    delete:
      tags:
      - Order Lines
      operationId: OrderLines_DeleteRoute
      parameters:
      - name: ids
        in: query
        required: true
        explode: true
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      deprecated: false
      security:
      - access_token: []
  /api/v1/admin/orderlines({key})/customerorderpromotions({customerorderpromotionKey}):
    get:
      tags:
