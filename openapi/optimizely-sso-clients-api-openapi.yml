components:
  schemas:
    Insite.Core.Security.SsoClientDto:
      type: object
      properties:
        clientId:
          type: string
        clientName:
          type: string
        flow:
          format: int32
          type: integer
        enabled:
          type: boolean
        requireConsent:
          type: boolean
        includeAdminScope:
          type: boolean
        includeStorefrontScope:
          type: boolean
        accessTokenLifetime:
          format: int32
          type: integer
        identityTokenLifetime:
          format: int32
          type: integer
        authorizationCodeLifetime:
          format: int32
          type: integer
        allowRefreshTokens:
          type: boolean
        absoluteRefreshTokenLifetime:
          format: int32
          type: integer
        slidingRefreshTokenLifetime:
          format: int32
          type: integer
        hasClientSecret:
          type: boolean
        clientSecret:
          type: string
        redirectUris:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
