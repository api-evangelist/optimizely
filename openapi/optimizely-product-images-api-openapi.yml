components:
  schemas:
    Insite.Data.Entities.ProductImage:
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        productId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        sortOrder:
          format: int32
          type: integer
        name:
          maxLength: 255
          minLength: 0
          type: string
        imageType:
          maxLength: 25
          minLength: 0
          type: string
        smallImagePath:
          maxLength: 1024
          minLength: 0
          type: string
        mediumImagePath:
          maxLength: 1024
          minLength: 0
          type: string
        largeImagePath:
          maxLength: 1024
          minLength: 0
          type: string
        altText:
          maxLength: 2048
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
