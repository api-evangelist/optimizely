components:
  schemas:
    Insite.Data.Entities.Persona:
      required:
      - description
      - name
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        activateOn:
          format: date-time
          type: string
        deactivateOn:
          format: date-time
          type: string
        description:
          maxLength: 1024
          minLength: 0
          type: string
        isDefault:
          type: boolean
        name:
          maxLength: 100
          minLength: 0
          type: string
        ruleManagerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        sequence:
          format: int32
          type: integer
        favorProducts:
          type: boolean
        enableSearchBoost:
          type: boolean
        boostValue:
          format: decimal
          type: number
        autoAssignGuestUser:
          type: boolean
        autoAssignMinimumActions:
          format: int32
          type: integer
        personaSource:
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  requestBodies:
    Affiliates_ArchiveParameters:
      content:
        application/json:
          schema:
            type: object
            properties: {}
      description: archive action parameters
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
