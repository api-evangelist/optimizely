components:
  schemas:
    Insite.Data.Entities.JobDefinition:
      required:
      - standardJobName
      - name
      - description
      - jobType
      - notifyEmail
      - notifyCondition
      - preProcessor
      - integrationProcessor
      - postProcessor
      - lastRunJobNumber
      - lastRunStatus
      - recurringType
      - linkedJobCondition
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        integrationConnectionId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        standardJobName:
          maxLength: 50
          minLength: 0
          type: string
        name:
          maxLength: 255
          minLength: 0
          type: string
        description:
          maxLength: 2048
          minLength: 0
          type: string
        jobType:
          maxLength: 255
          minLength: 0
          type: string
        debuggingEnabled:
          type: boolean
        passThroughJob:
          type: boolean
        notifyEmail:
          maxLength: 255
          minLength: 0
          type: string
        notifyCondition:
          maxLength: 255
          minLength: 0
          type: string
        linkedJobId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        passDataSetToLinkedJob:
          type: boolean
        useDeltaDataSet:
          type: boolean
        preProcessor:
          maxLength: 510
          minLength: 0
          type: string
        integrationProcessor:
          maxLength: 510
          minLength: 0
          type: string
        postProcessor:
          maxLength: 510
          minLength: 0
          type: string
        lastRunDateTime:
          format: date-time
          type: string
        lastRunJobNumber:
          maxLength: 255
          minLength: 0
          type: string
        lastRunStatus:
          maxLength: 255
          minLength: 0
          type: string
        recurringJob:
          type: boolean
        recurringStartDateTime:
          format: date-time
          type: string
        recurringEndDateTime:
          format: date-time
          type: string
        recurringInterval:
          format: int32
          type: integer
        recurringType:
          maxLength: 50
          minLength: 0
          type: string
        recurringStartTime:
          format: date-time
          type: string
        recurringStartDay:
          format: int32
          type: integer
        recurringAdvancedMode:
          type: boolean
        recurringCronExpression:
          maxLength: 200
          minLength: 0
          type: string
        emailTemplateId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        runStepsInParallel:
          type: boolean
        linkedJobCondition:
          maxLength: 50
          minLength: 0
          type: string
        maxErrorsBeforeFail:
          format: int32
          type: integer
        maxWarningsBeforeFail:
          format: int32
          type: integer
        maxRetries:
          format: int32
          type: integer
        maxDeactivationPercent:
          format: int32
          type: integer
        maxTimeoutMinutes:
          format: int32
          type: integer
        refreshBatchSize:
          format: int32
          type: integer
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
