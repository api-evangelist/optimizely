    servers:
    - url: https://dogfood.commerce.insitesandbox.com
  /api/v1/admin/pages/delete:
    delete:
      tags:
      - Pages
      operationId: Pages_DeleteRoute
      parameters:
      - name: ids
        in: query
        required: true
        explode: true
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      deprecated: false
      security:
      - access_token: []
    servers:
    - url: https://dogfood.commerce.insitesandbox.com
  /api/v1/admin/pages({key})/customproperties({custompropertyKey}):
    get:
      tags:
