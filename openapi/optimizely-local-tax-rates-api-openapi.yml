components:
  schemas:
    Insite.Data.Entities.LocalTaxRate:
      required:
      - postalCode
      - taxCode
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        postalCode:
          maxLength: 50
          minLength: 0
          type: string
        taxRate:
          format: decimal
          type: number
        taxCode:
          maxLength: 50
          minLength: 0
          type: string
        taxFreight:
          type: boolean
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
