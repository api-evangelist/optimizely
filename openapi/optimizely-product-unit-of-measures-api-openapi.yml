components:
  schemas:
    Insite.Data.Entities.ProductUnitOfMeasure:
      required:
      - unitOfMeasure
      - description
      - roundingRule
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        productId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        unitOfMeasure:
          maxLength: 50
          minLength: 0
          type: string
        description:
          maxLength: 100
          minLength: 0
          type: string
        qtyPerBaseUnitOfMeasure:
          format: decimal
          type: number
        roundingRule:
          maxLength: 50
          minLength: 0
          type: string
        multipleSaleQty:
          format: int32
          type: integer
        isDefault:
          type: boolean
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
