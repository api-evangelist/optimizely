components:
  schemas:
    Insite.Data.Entities.RuleTypeOption:
      required:
      - criteriaType
      - criteriaObject
      - description
      - criteriaProperty
      - valueType
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        ruleTypeId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        criteriaType:
          maxLength: 50
          minLength: 0
          type: string
        criteriaObject:
          maxLength: 255
          minLength: 0
          type: string
        description:
          maxLength: 2048
          minLength: 0
          type: string
        criteriaProperty:
          maxLength: 255
          minLength: 0
          type: string
        valueType:
          maxLength: 50
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
