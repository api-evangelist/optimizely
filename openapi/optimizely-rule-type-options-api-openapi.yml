      summary: Update entity in EntitySet RuleTypeOptions
      operationId: RuleTypeOptions_PatchById
      parameters:
      - name: id
        in: path
        description: 'key: id'
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
