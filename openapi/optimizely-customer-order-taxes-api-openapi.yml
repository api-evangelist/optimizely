components:
  schemas:
    Insite.Data.Entities.CustomerOrderTax:
      required:
      - taxCode
      - taxDescription
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        customerOrderId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        taxCode:
          maxLength: 50
          minLength: 0
          type: string
        taxDescription:
          maxLength: 100
          minLength: 0
          type: string
        taxRate:
          format: decimal
          type: number
        taxAmount:
          format: decimal
          type: number
        sortOrder:
          format: int32
          type: integer
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
