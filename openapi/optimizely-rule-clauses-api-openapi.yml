components:
  schemas:
    System.Threading.CancellationToken:
      type: object
      properties:
        isCancellationRequested:
          type: boolean
          readOnly: true
        canBeCanceled:
          type: boolean
          readOnly: true
        waitHandle:
          $ref: '#/components/schemas/System.Threading.WaitHandle'
    Insite.Data.Entities.RuleClause:
      required:
      - condition
      - criteriaType
      - criteriaObject
      - criteriaProperty
      - criteriaValue
      - comparisonOperator
      - simpleValue
      - valueList
      - valueMinimum
      - valueMaximum
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        ruleManagerId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        ruleTypeOptionId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        executionGroup:
          format: int32
          type: integer
        executionOrder:
          format: int32
          type: integer
        condition:
          maxLength: 50
          minLength: 0
          type: string
        criteriaType:
          maxLength: 50
          minLength: 0
          type: string
        criteriaObject:
          maxLength: 255
          minLength: 0
          type: string
        criteriaProperty:
          maxLength: 100
          minLength: 0
          type: string
        criteriaValue:
          maxLength: 255
          minLength: 0
          type: string
        comparisonOperator:
          maxLength: 50
          minLength: 0
          type: string
        simpleValue:
          maxLength: 2048
          minLength: 0
          type: string
        valueList:
          maxLength: 2048
          minLength: 0
          type: string
        valueMinimum:
          maxLength: 100
          minLength: 0
          type: string
        valueMaximum:
          maxLength: 100
          minLength: 0
          type: string
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
    Microsoft.Win32.SafeHandles.SafeWaitHandle:
      type: object
      properties:
        isInvalid:
          type: boolean
          readOnly: true
        isClosed:
          type: boolean
          readOnly: true
    System.Threading.WaitHandle:
      type: object
      properties:
        handle:
          type: object
        safeWaitHandle:
          $ref: '#/components/schemas/Microsoft.Win32.SafeHandles.SafeWaitHandle'
  requestBodies:
    System.Threading.CancellationToken:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/System.Threading.CancellationToken'
      description: import action parameters
      required: true
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
