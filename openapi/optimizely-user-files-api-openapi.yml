openapi: 3.2.0
info:
  version: admin-v1
  title: Admin API V1 User Files API
servers:
- url: https://dogfood.commerce.insitesandbox.com
security: []
tags:
- name: User Files
paths:
  /api/v1/admin/userfiles/{filename}:
    put:
      tags:
      - User Files
      operationId: UserFilesV1_PutAsyncByFilename
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/html:
              schema:
                type: object
      security:
      - access_token: []
    post:
      tags:
      - User Files
      operationId: UserFilesV1_PostAsyncByFilename
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
            text/html:
              schema:
                type: object
      security:
      - access_token: []
components:
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
      name: access_token
      in: query
