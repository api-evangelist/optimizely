    Insite.Data.Entities.GlobalSynonym:
      required:
      - synonymType
      - lookupValue
      - mappedValue
      - description
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        synonymType:
          maxLength: 50
          minLength: 0
          type: string
        lookupValue:
          maxLength: 50
          minLength: 0
          type: string
        mappedValue:
          maxLength: 50
          minLength: 0
          type: string
        description:
          maxLength: 100
          minLength: 0
          type: string
        parentId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        languageId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        createdOn:
          format: date-time
          type: string
        createdBy:
          type: string
        modifiedOn:
          format: date-time
          type: string
        modifiedBy:
          type: string
  securitySchemes:
    access_token:
      type: apiKey
      description: Token used to access storefront API.
