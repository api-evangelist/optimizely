        - is_multi_select
        - choices
    DetailedAssetRenditionResponse:
      allOf:
      - $ref: '#/components/schemas/BaseAssetRenditionResponse'
      - type: object
        properties:
          modified_at:
            type: string
            format: date-time
            description: Date and time on which the rendition was last modified, in ISO 8601 UTC format
            example: '2022-09-27T09:14:30Z'
          width:
            type:
            - integer
            - 'null'
            description: The width (in pixels) of the rendition
            example: 600
          height:
            type:
            - integer
            - 'null'
            description: The height (in pixels) of the rendition
            example: 400
          alt_text:
            type:
            - string
            - 'null'
            description: Alternative text for rendition
            example: image title
          original_asset_id:
