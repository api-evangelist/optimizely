          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /structured-contents/{id}:
    get:
      operationId: getStructuredContent
      tags:
      - Library
      summary: GET /structured-contents/{id}
      description: '<span style="background-color:#e95f6a;padding:5px;border-radius:5px">Experimental</span> Get the structured content. '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of the structured content
        example: a24b834427a043ab8caed1ded4606f7d
      responses:
        '200':
          description: Fetched structured content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryStructuredContent'
        '400':
          $ref: '#/components/responses/ClientError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateStructuredContent
      tags:
      - Library
      summary: PATCH /structured-contents/{id}
      description: '<span style="background-color:#e95f6a;padding:5px;border-radius:5px">Experimental</span> Updates a structured content. '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of the structured content
        example: 5d7f910551b00a722e0418830cee6631
      requestBody:
        description: Payload to update the structured content
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryStructuredContentUpdateRequest'
      responses:
        '200':
          description: Structured content updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryStructuredContent'
        '400':
          $ref: '#/components/responses/ClientError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
