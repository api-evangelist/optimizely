- aid: optimizely:mcp-experimentation
  name: Optimizely Remote MCP Server — Experimentation
  description: >-
    Optimizely's hosted remote Model Context Protocol server for Web and Feature Experimentation, on the
    Opal MCP platform. Tools are prefixed exp_ and cover querying projects/flags/experiments/environments,
    creating and updating flags, experiments and audiences, and searching SDK documentation. OAuth 2.0
    with dynamic client registration and PKCE; tools/list returned HTTP 401 anonymously when probed 2026-08-13.
  humanURL: >-
    https://support.optimizely.com/hc/en-us/articles/45320607594893-Optimizely-Experimentation-MCP-server-overview
