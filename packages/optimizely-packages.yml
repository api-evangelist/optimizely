description: >-
  First-party Optimizely client libraries. Optimizely maintains a full-matrix Feature
  Experimentation SDK family (JavaScript, React, Python, Ruby, PHP, C#, Java, Android,
  Swift, Go, Flutter) plus the self-hosted Agent microservice, the Optimizely Connect
  Platform (OCP) app SDK/CLI family published under the legacy @zaiusinc scope, and the
  Opal tools SDK. Every SDK in the experimentation family shipped a release in 2026 —
  there is no abandonment signal in this catalog.
