  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    Optimizely publishes no API deprecation policy and no sunset window. Deprecations are
    announced only as changelog entries and as `deprecated: true` flags inside the OpenAPI
    documents. The one breaking removal found in the changelog window (the `/metrics`
    endpoints removed from the Optimizely API, 2025-05-29) was announced in the changelog
    with a pointer to the replacement Metrics Hub Service, but no deprecation period was
    stated.
  mechanism: [openapi deprecated flag, changelog entry]

