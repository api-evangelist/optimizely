description: >-
  Optimizely publishes a dated, per-product API changelog inside its ReadMe developer
  portal. There is no single network-wide changelog — each product area has its own, and
  they are maintained at very different cadences. Every changelog page is also served as
  markdown by appending .md, which makes the whole history machine-readable.
scheme: dated-entries
versioning: none-per-entry
note: >-
  Entries are dated and titled but carry no version number — Optimizely versions its APIs
  in the URI path (v2, flags/v1, ODP v3, CMP v3) and does not tag changelog entries to a
  release. Product release notes (feature-level, not API-level) are published separately in
  the support help center.
