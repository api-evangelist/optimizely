  status: 200
  content_type: application/json
  file: optimizely-mcp-oauth-protected-resource.json
  document: true
  note: >-
    RFC 9728. Declares resource https://exp.mcp.opal.optimizely.com, authorization server
    https://auth.mcp.opal.optimizely.com, scopes_supported [mcp:tools]. The
    analytics.mcp.opal.optimizely.com and cms.mcp.opal.optimizely.com hosts each return the
    same shape for their own resource, pointing at the same authorization server.
- host: https://auth.mcp.opal.optimizely.com
