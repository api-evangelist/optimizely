source: live probes of every Optimizely website, docs, API and MCP host
description: >-
  RFC 8615 well-known probe across every host named in apis.yml (website, developer
  portal, API base URLs) and every OpenAPI servers[] host, plus the three Optimizely
  remote MCP hosts discovered in this pass. Optimizely serves a real RFC 9727
  /.well-known/api-catalog linkset from its developer documentation host, and RFC 9728
  OAuth protected-resource + RFC 8414 authorization-server metadata from its MCP hosts.
  It does NOT serve security.txt on any host.
notes:
  - >-
    docs.developers.optimizely.com is a ReadMe-hosted single-page app that answers HTTP
    200 with the same ~1.1MB HTML shell for most unknown /.well-known/* paths. Those 200s
    are recorded below as html-shell and treated as MISSES, not documents. Only
    /.well-known/api-catalog returned a real application/linkset+json body.
  - >-
    No agent card was found on any host. /.well-known/agent-card.json and
    /.well-known/agent.json were probed on every host below; every result was a 404 or an
    HTML shell, so no a2a/ artifact was written.
documents:
- host: https://docs.developers.optimizely.com
  path: /.well-known/api-catalog
  status: 200
  content_type: application/linkset+json
  file: optimizely-api-catalog.json
  document: true
  note: >-
    RFC 9727 API catalog. A two-level linkset — 14 product anchors, each pointing at its
    own nested /.well-known/api-catalog, which in turn names the product's published
    OpenAPI documents. This is what led to the 28 real OpenAPI specs now in
    openapi/_original/.
- host: https://exp.mcp.opal.optimizely.com
