description: >-
  Optimizely does not have one error contract — it has three, and an agent must know which
  API it is calling to parse a failure. Feature Experimentation Flags v1 returns RFC 9457
  (RFC 7807) `application/problem+json` with a documented ProblemDetail schema. The
  Experimentation REST API v2 returns a proprietary `application/json` envelope
  (code/message/messages/uuid). Optimizely Graph returns the GraphQL `errors[]` array with
  partial data and an HTTP 200 in some cases. Campaign returns a vendor media type
  (`application/vnd.optivo.broadmail.v1+json`).
