  media_type: application/problem+json
  schema: ProblemDetail
  fields: [type, title, status, detail, uuid]
  required: [type, title, status, detail]
  note: >-
    `type` contains `about:blank` when unspecified — Optimizely does not mint per-problem
    type URIs, so `title` + `status` are the only discriminators. `uuid` is an error
    reference for Optimizely support and is the value to quote in a ticket.
- id: optimizely-error-envelope
  spec: openapi/_original/optimizely-web-experimentation-optimizely-api-openapi.json
  media_type: application/json
  schema: Error
  fields: [code, message, messages, uuid]
  note: >-
    The v2 API's own envelope. `code` is a string slug (e.g. `not_found`), `messages` is a
    map of field-level validation errors, `uuid` is the support reference. This is the same
    body the api.optimizely.com edge returns for an unrouted path — a live GET of
    https://api.optimizely.com/.well-known/security.txt returned
    {"code":"not_found","message":"Nothing matches the given URI","uuid":"..."} with HTTP 404.
- id: graphql-errors
  spec: https://docs.developers.optimizely.com/platform-optimizely/docs/error-handling-and-rate-limits
  media_type: application/json
  fields: ['errors[].message', 'errors[].locations', 'errors[].path', 'errors[].extensions.code']
  note: >-
    Optimizely Graph returns partial `data` alongside `errors[]`. Syntax and validation
    errors are HTTP 400 with extensions.code such as GRAPHQL_VALIDATION_FAILED. A 200 with
    a non-empty `errors[]` is a failure — do not treat HTTP 200 as success on this surface.
- id: vendor-media-type
